// game-match 的战报回放、战斗剧本与论剑排位权威表（经 game-pbmysql 只扩不缩同步）。
syntax = "proto3";

package game.match.feature;

import "proto2mysql/proto2mysql_option.proto";

option java_package = "com.game.match.feature.pb";
option java_multiple_files = true;
option java_outer_classname = "MatchFeatureTablesProto";
option (proto2mysql.db) = true;

// ---- 战报回放（battle-report-replay.md） ----

message MatchBattleReportRow {
  option (proto2mysql.table_name) = "match_battle_report";
  option (proto2mysql.primary_key) = "battle_id";

  uint64 battle_id = 1;
  uint64 created_ms = 2;
  uint32 match_mode = 3;
  uint32 battle_config_id = 4;
  bytes envelope = 5;
  bytes envelope_digest = 6;
  uint32 ref_count = 7;
}

message MatchPlayerBattleReportRow {
  option (proto2mysql.table_name) = "match_player_battle_report";
  option (proto2mysql.primary_key) = "player_id,created_ms,battle_id";
  option (proto2mysql.index) = "player_id,battle_id";

  uint64 player_id = 1;
  uint64 created_ms = 2;
  uint64 battle_id = 3;
  bytes summary = 4;
}

// ---- 战斗剧本与运营审核（battle-script.md） ----

message MatchBattleScriptRow {
  option (proto2mysql.table_name) = "match_battle_script";
  option (proto2mysql.primary_key) = "script_id";
  option (proto2mysql.index) = "owner_player_id,submitted_ms,script_id;review_state,submitted_ms,script_id";

  uint64 script_id = 1;
  uint64 owner_player_id = 2;
  uint32 revision = 3;
  bytes content = 4;
  uint32 review_state = 5;
  uint32 approved_revision = 6;
  bytes approved_content = 7;
  string reject_reason = 8;
  uint64 submitted_ms = 9;
  uint64 reviewed_ms = 10;
}

message MatchBattleScriptReviewRow {
  option (proto2mysql.table_name) = "match_battle_script_review";
  option (proto2mysql.primary_key) = "script_id,revision";
  option (proto2mysql.index) = "reviewed_ms,script_id,revision";

  uint64 script_id = 1;
  uint32 revision = 2;
  uint64 owner_player_id = 3;
  bool approved = 4;
  string reviewer = 5;
  string reason = 6;
  uint64 reviewed_ms = 7;
  bytes content = 8;
}

message MatchBattleScriptLoadoutRow {
  option (proto2mysql.table_name) = "match_battle_script_loadout";
  option (proto2mysql.primary_key) = "player_id,match_mode,battle_config_id";
  option (proto2mysql.index) = "player_id,player_script_id";

  uint64 player_id = 1;
  uint32 match_mode = 2;
  uint32 battle_config_id = 3;
  uint32 origin = 4;
  uint32 official_script_id = 5;
  uint64 player_script_id = 6;
  uint64 updated_ms = 7;
}

// ---- 论剑排位首发 V1（ranked-play-v1-implementation.md） ----

message MatchRankedSeasonRow {
  option (proto2mysql.table_name) = "match_ranked_season";
  option (proto2mysql.primary_key) = "season_id";

  uint32 season_id = 1;
  string season_key = 2;
  string season_name = 3;
  uint64 rank_generation = 4;
  uint32 rule_version = 5;
  uint32 state = 6;
  uint64 start_ms = 7;
  uint64 end_ms = 8;
  uint32 battle_config_id = 9;
  uint64 champion_player_id = 10;
  string champion_name = 11;
  int64 champion_rating_centi = 12;
  bool rank_board_sealed = 13;
}

message MatchRankedPlayerPrefsRow {
  option (proto2mysql.table_name) = "match_ranked_player_prefs";
  option (proto2mysql.primary_key) = "player_id";

  uint64 player_id = 1;
  uint32 character_preset_id = 2;
  uint32 pet_preset_id = 3;
  uint32 rule_version = 4;
  string equipped_talisman_code = 5;
  string equipped_avatar_pattern_code = 6;
  string equipped_card_bg_code = 7;
  string equipped_title_code = 8;
  bool hide_talisman = 9;
  uint64 updated_ms = 10;
}

message MatchRankedPlayerSeasonRow {
  option (proto2mysql.table_name) = "match_ranked_player_season";
  option (proto2mysql.primary_key) = "season_id,player_id";
  option (proto2mysql.index) = "player_id,season_id";

  uint32 season_id = 1;
  uint64 player_id = 2;
  bool qualified = 3;
  int64 rating_centi = 4;
  int64 peak_rating_centi = 5;
  uint32 valid_matches = 6;
  uint32 wins = 7;
  uint32 losses = 8;
  uint32 draws = 9;
  uint64 qualified_at_ms = 10;
  uint32 milestone_bits = 11;
  uint64 final_rank = 12;
  bool champion_awarded = 13;
  uint64 updated_ms = 14;
  uint32 current_win_streak = 15;
  uint32 best_win_streak = 16;
}

message MatchRankedRewardRow {
  option (proto2mysql.table_name) = "match_ranked_reward";
  option (proto2mysql.primary_key) = "player_id,season_id,kind,tier_value";

  uint64 player_id = 1;
  uint32 season_id = 2;
  uint32 kind = 3;
  uint32 tier_value = 4;
  string item_code = 5;
  uint64 granted_at_ms = 6;
}

message MatchRankedBattleRow {
  option (proto2mysql.table_name) = "match_ranked_battle";
  option (proto2mysql.primary_key) = "player_id,battle_id";
  option (proto2mysql.index) = "player_id,settled_at_ms,battle_id";

  uint64 player_id = 1;
  uint64 battle_id = 2;
  uint32 season_id = 3;
  uint32 team_size = 4;
  uint32 status = 5;
  uint32 outcome = 6;
  uint32 player_team_index = 7;
  uint32 total_rounds = 8;
  bool participated = 9;
  bool fled = 10;
  int64 rating_before_centi = 11;
  int64 rating_after_centi = 12;
  int64 rating_delta_centi = 13;
  uint32 tier_before = 14;
  uint32 tier_after = 15;
  bool newly_qualified = 16;
  uint32 season_valid_matches_after = 17;
  bytes newly_unlocked_rewards_proto = 18;
  uint64 settled_at_ms = 19;
  uint32 character_preset_id = 20;
  uint32 pet_preset_id = 21;
  uint32 win_streak_after = 22;
  uint32 ended_opponent_streak = 23;
  bool revenged_rival = 24;
  string revenged_opponent_name = 25;
  uint32 revenged_wins_after = 26;
  uint32 revenged_losses_after = 27;
}

message MatchRankedRivalryRow {
  option (proto2mysql.table_name) = "match_ranked_rivalry";
  option (proto2mysql.primary_key) = "season_id,player_id,opponent_id";
  option (proto2mysql.index) = "season_id,player_id,updated_ms";

  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 opponent_id = 3;
  string opponent_name = 4;
  uint32 wins = 5;
  uint32 losses = 6;
  uint32 draws = 7;
  uint32 last_outcome = 8;
  uint64 last_battle_id = 9;
  uint64 updated_ms = 10;
}

message MatchRankedFeaturedBuildRow {
  option (proto2mysql.table_name) = "match_ranked_featured_build";
  option (proto2mysql.primary_key) = "season_id,build_key";
  option (proto2mysql.index) = "season_id,high_tier_wins,wins,featured_rating_centi;featured_battle_id";

  uint32 season_id = 1;
  string build_key = 2;
  uint32 season_seal_id = 3;
  uint32 starter_pet_table_id = 4;
  string core_skill_ids = 5;
  uint32 appearances = 6;
  uint32 wins = 7;
  uint32 high_tier_wins = 8;
  uint64 featured_battle_id = 9;
  uint64 featured_player_id = 10;
  string featured_player_name = 11;
  int64 featured_rating_centi = 12;
  uint32 featured_team_size = 13;
  uint32 featured_total_rounds = 14;
  uint64 updated_ms = 15;
}

// ---- 全服赛季战队锦标赛《群仙问道赛》V1（season-team-tournament-v1.md） ----

message MatchTournamentSeasonRow {
  option (proto2mysql.table_name) = "match_tournament_season";
  option (proto2mysql.primary_key) = "season_id";
  option (proto2mysql.index) = "stage,season_id";

  uint32 season_id = 1;
  string season_key = 2;
  string season_name = 3;
  uint32 rule_version = 4;
  uint32 stage = 5;
  uint64 registration_start_ms = 6;
  uint64 qualifier_start_ms = 7;
  uint64 knockout_start_ms = 8;
  uint64 settle_start_ms = 9;
  uint64 end_ms = 10;
  uint32 battle_team_size = 11;
  uint32 roster_max_size = 12;
  uint32 knockout_team_count = 13;
  uint64 champion_squad_id = 14;
  string champion_squad_name = 15;
  string champion_member_summary = 16;
  uint64 settled_ms = 17;
  uint64 updated_ms = 18;
  bytes champion_members_blob = 19;
  reserved 20;
  reserved "champion_salute_count";
  uint32 champion_emblem_id = 21;
  uint64 third_place_squad_id = 22;
  string third_place_squad_name = 23;
  uint32 third_place_emblem_id = 24;
  uint64 final_mvp_player_id = 25;
  string final_mvp_player_name = 26;
  uint32 final_mvp_score = 27;
  uint32 champion_honor_bits = 28;
}

message MatchTournamentChampionMembersBlob {
  repeated MatchTournamentMemberRow members = 1;
}

message MatchTournamentSquadRow {
  option (proto2mysql.table_name) = "match_tournament_squad";
  option (proto2mysql.primary_key) = "squad_id";
  option (proto2mysql.unique_key) = "season_id,name_norm";
  option (proto2mysql.index) = "season_id,state,qualifier_points,squad_id;season_id,final_rank,squad_id";

  uint64 squad_id = 1;
  uint32 season_id = 2;
  string name = 3;
  string name_norm = 4;
  uint64 captain_player_id = 5;
  uint32 state = 6;
  uint32 member_count = 7;
  uint32 qualifier_points = 8;
  uint32 qualifier_played = 9;
  uint32 qualifier_wins = 10;
  uint32 qualifier_losses = 11;
  uint32 qualifier_draws = 12;
  uint32 seed_rank = 13;
  uint32 final_rank = 14;
  uint32 cheer_count = 15;
  uint64 registered_ms = 16;
  uint64 updated_ms = 17;
  uint32 emblem_id = 18;
  uint32 honor_bits = 19;
}

message MatchTournamentMemberRow {
  option (proto2mysql.table_name) = "match_tournament_member";
  option (proto2mysql.primary_key) = "season_id,player_id";
  option (proto2mysql.index) = "squad_id,player_id";

  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 squad_id = 3;
  uint32 role = 4;
  uint32 starter_slot = 5;
  string player_name = 6;
  uint32 zone_id = 7;
  uint64 joined_ms = 8;
  uint32 class_id = 9;
  uint32 gender = 10;
  string appearance_id = 11;
}

message MatchTournamentInviteRow {
  option (proto2mysql.table_name) = "match_tournament_invite";
  option (proto2mysql.primary_key) = "squad_id,invitee_player_id";
  option (proto2mysql.index) = "invitee_player_id,state,expires_ms,squad_id";

  uint64 squad_id = 1;
  uint64 invitee_player_id = 2;
  uint32 season_id = 3;
  uint64 inviter_player_id = 4;
  uint32 state = 5;
  uint64 created_ms = 6;
  uint64 expires_ms = 7;
}

message MatchTournamentMatchRow {
  option (proto2mysql.table_name) = "match_tournament_match";
  option (proto2mysql.primary_key) = "match_id";
  option (proto2mysql.index) = "season_id,phase,round_index,slot_index;battle_id;season_id,phase,state,match_id";

  uint64 match_id = 1;
  uint32 season_id = 2;
  uint32 phase = 3;
  uint32 round_index = 4;
  uint32 slot_index = 5;
  uint64 squad_a_id = 6;
  uint64 squad_b_id = 7;
  bytes lineup_a = 8;
  bytes lineup_b = 9;
  bool ready_a = 10;
  bool ready_b = 11;
  uint32 state = 12;
  uint64 battle_id = 13;
  uint64 winner_squad_id = 14;
  uint32 outcome = 15;
  bool featured_spectate = 16;
  uint64 scheduled_start_ms = 17;
  uint64 deadline_ms = 18;
  uint64 finished_ms = 19;
  uint64 updated_ms = 20;
  uint32 best_of = 21;
  uint32 current_game_index = 22;
  uint32 wins_a = 23;
  uint32 wins_b = 24;
  uint32 current_leyline_element = 25;
  string leyline_sequence = 26;
  uint64 intermission_deadline_ms = 27;
  bool is_third_place = 28;
  uint64 mvp_player_id = 29;
  string mvp_player_name = 30;
  uint64 mvp_squad_id = 31;
  uint32 mvp_score = 32;
  uint64 mvp_damage = 33;
  uint64 mvp_healing = 34;
  uint32 mvp_controls = 35;
  uint32 banned_leyline_a = 36;
  uint32 banned_leyline_b = 37;
}

message MatchTournamentMatchGameRow {
  option (proto2mysql.table_name) = "match_tournament_match_game";
  option (proto2mysql.primary_key) = "match_id,game_index";
  option (proto2mysql.unique_key) = "battle_id";
  option (proto2mysql.index) = "season_id,battle_id";

  uint64 match_id = 1;
  uint32 game_index = 2;
  uint32 season_id = 3;
  uint32 phase = 4;
  uint64 battle_id = 5;
  uint32 leyline_element = 6;
  uint64 winner_squad_id = 7;
  uint32 outcome = 8;
  uint64 finished_ms = 9;
}

message MatchTournamentCheerRow {
  option (proto2mysql.table_name) = "match_tournament_cheer";
  option (proto2mysql.primary_key) = "season_id,player_id";
  option (proto2mysql.index) = "season_id,squad_id,player_id";

  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 squad_id = 3;
  bool rewarded = 4;
  uint64 created_ms = 5;
}

message MatchTournamentRewardRow {
  option (proto2mysql.table_name) = "match_tournament_reward";
  option (proto2mysql.primary_key) = "season_id,player_id,tier_kind";
  option (proto2mysql.index) = "player_id,season_id,tier_kind;delivery_state,updated_ms,reward_id";

  uint32 season_id = 1;
  uint64 player_id = 2;
  uint32 tier_kind = 3;
  uint64 reward_id = 4;
  uint64 squad_id = 5;
  uint32 final_rank = 6;
  uint32 tier_id = 7;
  uint64 gold_amount = 8;
  bytes attachments = 9;
  string title_code = 10;
  string badge_code = 11;
  uint32 delivery_state = 12;
  uint64 mail_id = 13;
  uint64 claimed_ms = 14;
  uint64 updated_ms = 15;
}

message MatchTournamentPredictionRow {
  option (proto2mysql.table_name) = "match_tournament_prediction";
  option (proto2mysql.primary_key) = "season_id,player_id,match_id";
  option (proto2mysql.index) = "season_id,match_id,predicted_squad_id;season_id,result_state,player_id";

  uint32 season_id = 1;
  uint64 player_id = 2;
  uint64 match_id = 3;
  uint64 predicted_squad_id = 4;
  uint32 round_index = 5;
  bool is_third_place = 6;
  string player_name = 7;
  uint32 result_state = 8;
  uint32 earned_points = 9;
  uint64 created_ms = 10;
  uint64 updated_ms = 11;
}
