syntax = "proto3";

// 玩家在线状态的持久化载体：Java 版自有格式，不与 mmorpg 共享（两版各有库表，不混部）。
// 存在 player_state.data（MEDIUMBLOB），与 player 行在同一个事务里、同一个 owner_epoch 围栏下写入。
//
// 演进规则（存量数据靠它向前兼容）：
//   - 每个玩法一个字段，只增不改；字段号一经使用不复用，删字段写 reserved。
//   - 各玩法数据内部同样只增不改；读到默认值（老数据没有这段）必须是「初始状态」的合法表示。
//   - 不放在 player 表里有独立列的字段（等级、场景、坐标），避免两处真相。

package xm.storage;

option java_package = "com.game.player.store.state";
option java_multiple_files = true;

message PlayerState {
  // 朝向：最近一次移动上报的 rotation；没有上报过时不设（进场后不带朝向，与基线一致）。
  Facing facing = 1;
  // 货币。
  CurrencyState currency = 2;
  // 属性加点：方案与已分配点。点数总量（按等级与表换算）、二级属性都不落库，每次加载重算。
  AttributeState attribute = 3;
  // 背包（四个固定包：0 人物背包、1 仓库、2 装备栏、3 临时格，同 mmorpg BagType）。
  BagState bag = 4;
  // 任务（mmorpg QuestAllData 的 Java 自有对应；只有 scope 0 可操作，不存 scope 层）。
  MissionState mission = 5;
  // 当前气血 / 法力（mmorpg BaseAttributesComp.health / mana 的 Java 自有对应；力量 / 护甲等成长属性不存，用到时由职业表即时算出）。
  // 没有这段 = 满血满蓝（新号、2.7 之前的存档、或写盘那一刻正好满）：进场按上限回满，与基线新号回满同义。
  Vitals vitals = 6;
  // 宝宝（mmorpg PlayerPetComp 的 Java 自有对应）。没有这段 = 没有宝宝、未出战。
  PetState pets = 7;
  // 通用资产通道的幂等账本（mmorpg PlayerAssetOpLedgerComp 的 Java 自有对应），与资产同一份记录、同一次围栏写：
  // 扣款 / 发放与「这条 seq 已经处理过」原子落盘。没有这段 = 从没收到过资产通道请求。
  AssetOpLedgerState asset_ledger = 8;
}

// 资产通道账本：每条流一本，按流号升序。
message AssetOpLedgerState {
  repeated AssetOpStreamLedgerState streams = 1;
}

// 一条流的账本：1024 位窗口覆盖 (watermark, watermark + 1024]，位 i ↔ seq = watermark + 1 + i（第 i / 64 个字的第 i % 64 位）。
message AssetOpStreamLedgerState {
  // 流号（1 帮会扣、2 帮会发、3 交易扣、4 交易发、5 系统发）。
  uint32 stream = 1;
  uint64 watermark = 2;
  // 已见 / 已应用位图，各恰好 16 个字；applied ⊆ seen，已见未应用 = 已拒。
  repeated fixed64 seen_bits = 3;
  repeated fixed64 applied_bits = 4;
  // 窗口内被拒 seq 的原因（只收非 0 原因，按 seq 升序，至多 64 条）。
  repeated AssetOpRejectionState rejections = 5;
  // 本纪元见过的最大 seq（跳号上限的基准）。
  uint64 max_seq = 6;
  // 流纪元（调用方建这本 seq 时的毫秒）；更大的纪元整条流重置。
  uint64 stream_epoch = 7;
  // 窗口内部分发放的 seq（按升序，至多 64 条）。
  repeated uint64 partial_seqs = 8;
}

message AssetOpRejectionState {
  uint64 seq = 1;
  uint32 reason_tip_id = 2;
}

// 宝宝：实例按获得顺序；二级属性与点数总量不落库（按资质 + 已分配 + 等级现算）。
message PetState {
  repeated PetEntry pets = 1;
  // 出战中的宝宝；0 = 未出战。
  uint64 active_pet_id = 2;
}

// 一只宝宝（mmorpg PetInstance 的 Java 自有对应）。
message PetEntry {
  // 全服唯一的雪花号（场景节点在全服号段租约上发，与物品同一个号源）。
  uint64 pet_id = 1;
  // 种类（Pet 表 id）。
  uint32 pet_table_id = 2;
  // 玩家改的名字；空 = 用 Pet.name。
  string name = 3;
  // 等级（= min(主人等级, Pet.level_cap)，每次重算同步；存下来供离线展示与加载时按旧等级换算当前值）。
  uint32 level = 4;
  // 维度号 → 已分配点（只存非 0）。
  map<uint32, uint32> allocated = 5;
  // 维度号 → 资质（万分比，10000 = 100%），出生时在 Pet.aptitude_min / max 之间随机，之后不变；缺键按 10000。
  map<uint32, uint32> aptitude = 6;
  // 当前气血 / 法力（回合制战斗结算回写，残血跨登录保留）。
  uint64 health = 7;
  uint64 mana = 8;
  // 获得时间（Unix 秒）。
  uint64 created_at = 9;
  // 实例学会的技能（技能书是二期，恒空；种类自带技能不抄进实例）。
  repeated uint32 skill_table_ids = 10;
}

// 当前气血 / 法力。health == 0 = 阵亡：进场按上限回满（基础复活）；活着的进场只按新上限往下夹，不补。
message Vitals {
  uint64 health = 1;
  uint64 mana = 2;
}

// 背包（mmorpg BagAllData 的 Java 自有对应；基线的动态包没有生产创建点，不存）。
message BagState {
  // 各背包容量，下标 = bag_type；缺的项或 0 = 取当前版本的缺省容量（100 / 200 / 10 / 200）。
  // 只在有包不是缺省容量时才写（目前没有扩容入口，所以总是空），缺省容量的包写 0：以后调高缺省容量，老玩家也一并生效。
  // 下标 4 起是本版本不认识的背包的容量，原样保留、写回。
  repeated uint32 capacities = 1;
  // 全部物品实例，按 (bag_type, pos) 升序写出（周期存盘按值比对脏数据，顺序必须确定）。
  repeated BagItemState items = 2;
}

// 一个物品实例（mmorpg ItemEntry 的 Java 自有对应）。
message BagItemState {
  // 实例 guid：全服唯一的雪花号（场景节点在全服号段租约上发），永不为 0。
  uint64 item_uuid = 1;
  uint32 config_id = 2;
  // 堆叠数（不可叠加物品恒为 1）。
  uint32 stack_size = 3;
  // 格子号；装备栏里就是 EquipSlot.id。
  uint32 pos = 4;
  // 所在背包（0–3）；本版本不认识的值原样保留、写回（滚动升级 / 回滚期间不丢东西）。
  uint32 bag_type = 5;
  // 入包序号（临时格先进先出淘汰的依据）；0 = 老数据，加载时按出现顺序补盖。
  uint64 acquire_seq = 6;
}

message CurrencyState {
  // 下标 = 币种（0 金币、1 钻石、2 绑钻，同 mmorpg kCurrency*）；缺的槽按 0。
  repeated uint64 balances = 1;
  // GM 封禁获取的币种（按封禁先后）。
  repeated uint32 blocked_types = 2;
  // 补缴欠款（mmorpg CurrencyComp.debts 的 Java 自有对应），按币种升序：之后到账的该币种收入先抵欠款。
  // 目前没有任何写入入口（同基线：GM 挂欠款随路线图 7.2），只会来自存档。
  repeated CurrencyDebtState debts = 3;
}

// 一笔补缴欠款。
message CurrencyDebtState {
  uint32 currency_type = 1;
  // 欠款总额与已抵扣额；剩余 = owed − paid，还清即删。
  uint64 owed = 2;
  uint64 paid = 3;
  // GM 冻结：暂停自动抵扣。
  bool frozen = 4;
  // 到期时间（Unix 秒，0 = 不过期）；过期后不再抵扣（不删）。
  uint64 expires_at = 5;
  string reason = 6;
  string gm_operator = 7;
  uint64 created_at = 8;
}

message Facing {
  double x = 1;
  double y = 2;
  double z = 3;
}

// 属性加点（mmorpg PlayerAttributeComp 的 Java 自有对应；基线的额外点 bonus_points / 外部加成 bonus_values 没有写入方，暂不存）。
message AttributeState {
  // 加点方案，按创建先后（面板按这个顺序列出）。
  repeated AttributeScheme schemes = 1;
  // 当前生效方案；0 = 未初始化（加载时补默认方案）。
  uint32 active_scheme_id = 2;
  // 方案 id 自增游标（id 不复用）；0 = 未初始化（加载时取已有最大 id + 1）。
  uint32 next_scheme_id = 3;
  // 上次切换方案的 Unix 秒（切换冷却）。
  uint64 last_switch_time = 4;
}

message AttributeScheme {
  uint32 scheme_id = 1;
  string name = 2;
  // dimension_id → 已分配点（只存非 0；所属池由表 AttributeDimension 决定）。
  map<uint32, uint32> allocated = 3;
}

// 任务状态。三个列表都按 mission_id 无符号升序写出（周期存盘按值比对脏数据，顺序必须确定）；
// 表里已删除的任务 id 照样保留（列表里显示 configured=false）。
message MissionState {
  // 进行中的任务。
  repeated ActiveMission active = 1;
  // 已完成的任务（终态，不会重开）。
  repeated uint32 completed_ids = 2;
  // 可领奖的任务（正常应 ⊆ completed_ids；不一致时 195 回 1002，同基线）。
  repeated uint32 claimable_ids = 3;
}

message ActiveMission {
  uint32 mission_id = 1;
  // 下标 = Mission.condition_id 的下标（顺序任务靠它定位当前格）；与表里条件数不一致时永不推进、永不完成（同基线，不修补）。
  repeated uint32 progress = 2;
  // 接取时刻（UTC 毫秒，基线 mission_begin_time；客户端不可见，完成后不再保留）。
  uint64 accepted_at_ms = 3;
}
