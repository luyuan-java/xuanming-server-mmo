# 本版本独立部署，不与 C++/Go 版混用内部服务或密钥。
spring:
  application:
    name: game-mall
  sql:
    init:
      mode: never
  datasource:
    # 库名遵守全仓 namespace 规则；仅覆盖主机/端口，不自动创建库或导入示例数据。
    url: "jdbc:mysql://${GAME_MYSQL_HOST:127.0.0.1}:${GAME_MYSQL_PORT:4000}/${game.namespace:game}?useSSL=false&characterEncoding=utf8&connectTimeout=3000&socketTimeout=6000&useAffectedRows=true"
    username: ${GAME_MYSQL_USER:root}
    password: ${GAME_MYSQL_PASSWORD:}
server:
  address: ${GAME_MALL_BIND_ADDRESS:127.0.0.1}
  port: ${GAME_MALL_PORT:18120}
  error:
    include-message: never
    include-stacktrace: never
game:
  run-mode: ${GAME_RUN_MODE:prod}
  mall:
    require-tidb: ${GAME_MALL_REQUIRE_TIDB:true}
    gateway-secret: ${GAME_MALL_GATEWAY_SECRET:}
    payment-secret: ${GAME_MALL_PAYMENT_SECRET:}
    delivery-secret: ${GAME_MALL_DELIVERY_SECRET:}
    admin-secret: ${GAME_MALL_ADMIN_SECRET:}
    admin-subject: ${GAME_MALL_ADMIN_SUBJECT:mall-admin}
    payment-subject: ${GAME_MALL_PAYMENT_SUBJECT:payment-adapter}
    max-unpaid-orders: ${GAME_MALL_MAX_UNPAID_ORDERS:5}
    mock-payment-enabled: ${GAME_MALL_MOCK_PAYMENT_ENABLED:false}
    allowed-payment-channels: ${GAME_MALL_ALLOWED_PAYMENT_CHANNELS:}
    consignment:
      notice-ms: ${GAME_MALL_CONSIGNMENT_NOTICE_MS:172800000}
      sale-ms: ${GAME_MALL_CONSIGNMENT_SALE_MS:604800000}
      cooling-ms: ${GAME_MALL_CONSIGNMENT_COOLING_MS:259200000}
      fee-bps: ${GAME_MALL_CONSIGNMENT_FEE_BPS:500}
      currencies: ${GAME_MALL_CONSIGNMENT_CURRENCIES:0}
