syntax = "proto3";

// 资产流水：Java 版自有格式与 topic（不与 mmorpg 的 TransactionLogEntry / transaction_log_topic 共享——两版各有存储，不混部）。
// 每条 Kafka 消息是一条 TransactionLogRecord；键 = 玩家号的无符号十进制（扣减方优先、否则获得方），同一玩家的流水进同一分区、按序。
//
// 演进规则：只增不改，字段号与枚举值一经使用不复用。

package xm.audit;

option java_package = "com.game.audit.proto";
option java_multiple_files = true;

// 变动原因。与 mmorpg TransactionType 含义相同的沿用其数值；Java 独有的从 1001 起。
enum TransactionReason {
  TX_REASON_UNSPECIFIED = 0;
  // 任务奖励（同 mmorpg TX_QUEST_REWARD）
  TX_QUEST_REWARD = 7;
  // 系统发放（同 mmorpg TX_SYSTEM_GRANT：没有更具体来源的入包）
  TX_SYSTEM_GRANT = 8;
  // GM 凭空发放 / 扣除（同 mmorpg TX_GM_GRANT / TX_GM_DEDUCT）
  TX_GM_GRANT = 9;
  TX_GM_DEDUCT = 10;
  // 物品销毁（同 mmorpg TX_ITEM_DESTROY）：临时格淘汰（数量 = 真实堆叠数）、整理时合并掉的空实例（数量 0）
  TX_ITEM_DESTROY = 13;
  // 属性洗点的金币（mmorpg 记通用消费 TX_CURRENCY_DEDUCT）
  TX_ATTRIBUTE_RESET = 1001;
  // 开新加点方案的金币（同上）
  TX_ATTRIBUTE_SCHEME_CREATE = 1002;
  // 宝宝洗点 / 改名的金币（mmorpg 记通用消费 TX_CURRENCY_DEDUCT）
  TX_PET_RESET = 1003;
  TX_PET_RENAME = 1004;
  // 资产通道与补缴用到的原因（数值同 mmorpg TransactionType）
  TX_TRADE = 1;
  TX_MAIL_ATTACHMENT = 2;
  TX_AUCTION_SELL = 3;
  TX_AUCTION_BUY = 4;
  TX_DEFERRED_CLAWBACK = 18;
  TX_GUILD_DONATE = 24;
  TX_GUILD_SHOP = 25;
  TX_GUILD_ACTIVITY_REWARD = 26;
  // 运维面（xm-data 直写，数值同 mmorpg TransactionType；基线有枚举值、没有写入方）：
  // 回档恢复（余额 / 实例变化，correlation_id = 作业号）、精确回收、批量回收
  TX_ROLLBACK_RESTORE = 16;
  TX_CLAWBACK = 17;
  TX_BATCH_RECALL = 19;
}

// 资产种类：货币类型 0 是金币，只看 currency_type 分不出「货币」还是「物品」，所以单列。
enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_CURRENCY = 1;
  ASSET_ITEM = 2;
}

message TransactionLogRecord {
  // 全局唯一（雪花号，场景节点在全服范围的号段租约上发）；0 = 无效
  uint64 tx_id = 1;
  // 变动发生的 Unix 毫秒
  int64 time_ms = 2;
  TransactionReason reason = 3;
  AssetKind kind = 4;
  // 扣减方 / 获得方玩家号；0 = 系统
  uint64 from_player = 5;
  uint64 to_player = 6;
  // 货币变动（kind = ASSET_CURRENCY）：加为正、扣为负
  uint32 currency_type = 7;
  int64 currency_delta = 8;
  uint64 balance_before = 9;
  uint64 balance_after = 10;
  // 物品变动（kind = ASSET_ITEM）：入包记获得方 to_player，销毁 / 淘汰记扣减方 from_player（同 mmorpg LogItemCreate / LogItemDestroy）
  uint64 item_uuid = 11;
  uint32 item_config_id = 12;
  uint32 item_quantity = 13;
  // 关联号（同一业务操作的多条流水共用）；0 = 无
  uint64 correlation_id = 14;
  // 附加信息（JSON，至多 1024 个字符）
  string extra = 15;
  // 变动发生时玩家所在的 zone
  uint32 zone_id = 16;
}
