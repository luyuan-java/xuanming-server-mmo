syntax = "proto3";
option java_package = "com.game.table";
option java_outer_classname = "ActoractionstateTableOuterClass";
option java_multiple_files = true;

// ActorActionState 表的权威 schema。源表 data/ActorActionState.xlsx。
//
// 本文件不参与 protoc 编译,也不进任何语言的构建;导表器直接文本解析它。
// 字段号是从 generated/code/proto/actoractionstate_table.proto 抄来的现状值,**只增不改、删字段用 reserved**。

package mmorpg.cfgtable.v1;

import "cfg_options.proto";

message ActorActionStatestate {
  uint32 state_mode = 1;
  uint32 state_tip = 2;
}

message ActorActionStateTable {
  option (cfg_sheet)       = "ActorActionState";
  option (cfg_source_file) = "ActorActionState.xlsx";
  option (cfg_primary_key) = "id";

  uint32 id = 1;
  reserved 9001; // constants_name：cfg_owner = "constants_name"，不进服务端产物（ContractSync 改写）
  repeated ActorActionStatestate state = 2 [(cfg_slots) = 3];
}
