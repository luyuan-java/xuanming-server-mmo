# xm-gateway：客户端 HTTP 入口（区服列表、分配 gate、HTTP 登录与刷新令牌）。进程从仓库根目录启动。
# 必需环境变量：XM_GATE_TOKEN_SECRET（gate 令牌签名密钥，须与 xm-gate 一致）、XM_DUBBO_SECRET（Dubbo 调用鉴权，须与 xm-login 一致）；
# 缺失则启动失败。
server:
  port: 18081
  shutdown: graceful

spring:
  application:
    name: xm-gateway
  jackson:
    # 客户端契约：JSON 键一律 snake_case（Go robot / UE 客户端按下划线键名解析）。
    property-naming-strategy: SNAKE_CASE
  lifecycle:
    timeout-per-shutdown-phase: 10s

# 管理端点：http://127.0.0.1:18081/actuator/health 与 /actuator/prometheus（与客户端 HTTP 接口同一个端口，本地开发用）。
# 面向公网部署时必须把它与 /api 分开：设 MANAGEMENT_SERVER_PORT（另起端口）+ MANAGEMENT_SERVER_ADDRESS（绑内网地址），
# 或在入口网关上拦掉 /actuator（architecture.md §11）。
management:
  # 管理端点与对外的 /api 分开：独立端口、默认只绑本机（与其他进程一致），公网入口永远看不到 /actuator
  server:
    port: 18105
    address: ${XM_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

xm:
  zone-id: 1
  redis:
    address: redis://127.0.0.1:6379
    database: 12
    # 单条命令最坏阻塞 = (retry-attempts + 1) × timeout-ms + retry-attempts × retry-delay-ms，
    # 必须低于客户端 HTTP 超时（robot 单次 assign-gate 等 5s）；默认 2×2000+200 = 4.2s（见 RedisProperties）。
    connect-timeout-ms: 2000
    timeout-ms: 2000
    retry-attempts: 1
    retry-delay-ms: 200
  dubbo:
    # xm-login 的 Dubbo 地址（HTTP 登录 / 刷新令牌）；nacos profile 置空走注册中心。
    login-url: tri://127.0.0.1:20881
  gateway:
    # 区服列表：顺序即 /api/server-list 的展示顺序。status 取 OPEN / MAINTENANCE / CLOSED，必填。
    # maintenance-msg 只在 MAINTENANCE / CLOSED 时随区服列表下发。
    zones:
      - zone-id: ${xm.zone-id}
        name: 一区
        status: OPEN
        recommended: true

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    # 同机多个 Dubbo 进程会抢 QoS 端口 22222
    qos-enable: false
  registry:
    address: N/A
  consumer:
    check: false
    # 调 xm-login 的超时（同基线 login.grpc.timeout-ms = 3000）：须小于客户端 HTTP 的 5 s，失败才能带着 {code:500} 回给客户端。
    timeout: 3000
