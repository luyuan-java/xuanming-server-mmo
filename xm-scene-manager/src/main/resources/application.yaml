# xm-scene-manager 默认（local）配置：Dubbo 直连、不需要 Nacos 服务端。进程从仓库根目录启动。
# 用 Nacos 做注册中心时加 --spring.profiles.active=nacos（见 application-nacos.yaml）。
# 秘密只从环境变量注入：
#   XM_DUBBO_SECRET  Dubbo 调用方鉴权密钥（必填，xm-login / xm-scene-manager / xm-gate 必须一致；缺失即拒绝启动）
spring:
  application:
    name: xm-scene-manager
  main:
    # 只为管理端点起一个 Servlet 容器（Tomcat）；Dubbo 端口不经过它（architecture.md §11）。
    web-application-type: servlet
    # Dubbo / Netty 线程都是守护线程，靠它让进程常驻（不依赖管理端口的 Tomcat 线程）；上下文关闭时退出。
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

# 管理端点：http://127.0.0.1:18102/actuator/health 与 /actuator/prometheus，这个 HTTP 端口上只有 actuator。
# 默认只绑本机；要被别的机器上的 Prometheus 抓取时用 XM_MANAGEMENT_ADDRESS 指定内网地址（不要暴露到公网）。
# 端口可用 SERVER_PORT 覆盖（Windows 上避开保留端口段 50060-50159）。
server:
  port: 18102
  address: ${XM_MANAGEMENT_ADDRESS:127.0.0.1}
  # 管理端口上没有需要排空的业务请求。
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

xm:
  # 按方法热关停（运维止血阀）：每秒全量读 Redis 哈希 xm:killswitch；失联超过 60 s 整体放行（fail-open）
  killswitch:
    enabled: true
  # 对外通告地址（Dubbo 注册 / 通告用）；非本机部署用环境变量 XM_ADVERTISE_HOST 覆盖。
  # 注意它不是绑定地址：Dubbo 把 127.* 视为无效绑定地址，host=127.0.0.1 时实际监听 0.0.0.0（DUBBO_IP_TO_BIND 也不接受回环），
  # 端口无法只绑本机——调用方鉴权（XM_DUBBO_SECRET）是必需的；生产用 DUBBO_IP_TO_BIND 绑内网网卡并配防火墙。
  advertise-host: 127.0.0.1
  # 配置表目录（导表器 .pb 产物），相对进程工作目录；从别处启动时用 XM_TABLE_DIR 覆盖。
  table-dir: config-data/tables
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  scene-manager:
    # 默认世界地图（scene_config_id）。不配 = World 表按表序第一行的 scene_id（当前为 1）。
    # default-world-config-id: 1
    # 主世界频道（批次 5.1，docs/porting/scene-channels-spec.md §5.2）。下面是缺省值，不配即生效。
    world:
      # login 的归属夺取等待（xm.login.owner-claim-wait）的镜像：启动时校验 reservation-ttl ≥ 它（Q8）。两边配不同值时改这里。
      login-owner-claim-wait: ${xm.login.owner-claim-wait:3s}
      # channel-count: 1                 # 每图种子频道数（只在首次播种时用；之后以 Redis xm:world:{z:<zone>}:desired 为准）
      # channel-count-by-config:         # 按 scene_config_id 覆盖种子（本机切片保持每图 1 个，Q4；基线开发配置是 "1": 16）
      #   "[1]": 16
      # coverage: per-node               # per-node（缺省，5.2 后保持，Q4）/ hash（只带地图的 63 可能跨节点）
      # tick: 5s                         # 领导者一拍
      # dead-node-grace: 20s             # 节点缺席满这么久，删它名下的频道记录、在活节点上用新号重铺
      # leader-lock-ttl: 30s             # 分 zone 领导锁 TTL（续期 TTL/3、有效 2/3 TTL）
      # leader-eligible: true            # false = 本副本只做分配，不竞选
      # cleanup-orphans: true            # World 表删掉的图：频道排空后删除
      # reservation-ttl: 10s             # 进场软预占 TTL；0 = 关闭
      # rebalance:                       # 择机迁移（只在 coverage=hash）
      #   max-migrations-per-tick: 10
      #   interval: 300s
      # autoscale:                       # 自动扩缩容（缺省关；drain-timeout 不论开关都生效）
      #   enabled: false
      #   check-interval: 30s
      #   scale-out-players: 2000
      #   scale-in-players: 100
      #   min-channels: 1
      #   max-channels: 16
      #   cooldown: 120s
      #   drain-timeout: 300s

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    # 同机多个 Dubbo 进程会抢 QoS 端口 22222。
    qos-enable: false
  protocol:
    name: tri
    port: 20882
    host: ${xm.advertise-host}
  registry:
    address: N/A
  provider:
    timeout: 3000
