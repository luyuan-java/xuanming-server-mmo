# game-login 默认（local）配置：Dubbo 直连、不需要 Nacos 服务端。进程从仓库根目录启动（table-dir 是相对路径）。
# 用 Nacos 做注册中心时加 --spring.profiles.active=nacos（见 application-nacos.yaml）。
#
# 秘密只从环境变量注入，不写进本文件：
#   GAME_LOGIN_DEV_PASSWORD  开发口令（game.login.mode=dev 时必填，缺失即拒绝启动）
#   GAME_MYSQL_PASSWORD      MySQL 密码（本机无密码的 root 可不设）
#   GAME_DUBBO_SECRET        Dubbo 调用方鉴权密钥（必填，game-login / game-scene-manager / game-gate 必须一致；缺失即拒绝启动）
spring:
  application:
    name: game-login
  main:
    # 只为管理端点起一个 Servlet 容器（Tomcat）；Dubbo 端口不经过它（architecture.md §11）。
    web-application-type: servlet
    # Dubbo / Netty 线程都是守护线程，靠它让进程常驻（不依赖管理端口的 Tomcat 线程）；上下文关闭时退出。
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 库名 = 部署命名空间 game.namespace（环境变量 GAME_NAMESPACE，缺省 game）；部署只覆盖 host / port，启动时核对 DATABASE() 等于命名空间
    # （库名偏离规格的存量部署应急用 game.mysql.expect-database，环境变量 GAME_MYSQL_EXPECT_DATABASE）。
    # createDatabaseIfNotExist：本地开发首次启动自动建库 <ns>（缺省 game）。connect / socket 超时给阻塞 I/O 设上界，
    # 数据库卡死时请求在客户端 15s 预算内失败，而不是把 login-worker 线程永久挂住。
    url: jdbc:mysql://127.0.0.1:3306/${game.namespace:game}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000
    username: ${MMORPG_SQL_USERNAME}
    password: ${MMORPG_SQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 32
      # 取连接最多等 3s（Druid 默认 -1 = 无限等）。
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
  sql:
    init:
      # 表结构只由 game-login 初始化（建表语句幂等：CREATE TABLE IF NOT EXISTS）。
      mode: never
      schema-locations: classpath:db/game-route-authority-schema.sql,classpath:db/game-player-schema.sql
      encoding: UTF-8
      continue-on-error: false

# 管理端点：http://127.0.0.1:18101/actuator/health 与 /actuator/prometheus，这个 HTTP 端口上只有 actuator。
# 默认只绑本机；要被别的机器上的 Prometheus 抓取时用 GAME_MANAGEMENT_ADDRESS 指定内网地址（不要暴露到公网）。
# 端口可用 SERVER_PORT 覆盖（Windows 上避开保留端口段 50060-50159）。
server:
  port: 18101
  address: ${GAME_MANAGEMENT_ADDRESS:127.0.0.1}
  # 管理端口上没有需要排空的业务请求。
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

game:
  player-trade:
    require-guild-exit: ${GAME_PLAYER_TRADE_REQUIRE_GUILD_EXIT:true}
  # 按方法热关停（运维止血阀）：每秒全量读 Redis 哈希 game:killswitch；失联超过 60 s 整体放行（fail-open）
  killswitch:
    enabled: true
  # 对外通告地址（Dubbo 注册 / 通告用）；非本机部署用环境变量 GAME_ADVERTISE_HOST 覆盖。
  # 注意它不是绑定地址：Dubbo 把 127.* 视为无效绑定地址，host=127.0.0.1 时实际监听 0.0.0.0（DUBBO_IP_TO_BIND 也不接受回环），
  # 端口无法只绑本机——调用方鉴权（GAME_DUBBO_SECRET）是必需的；生产用 DUBBO_IP_TO_BIND 绑内网网卡并配防火墙。
  advertise-host: 127.0.0.1
  zone-id: 1
  # 配置表目录（导表器 .pb 产物），相对进程工作目录；从别处启动时用 GAME_TABLE_DIR 覆盖。
  table-dir: config-data/tables
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  dubbo:
    scene-manager-url: tri://127.0.0.1:20882
  login:
    role-trade:
      enabled: ${GAME_PLAYER_TRADE_ENABLED:false}
    # dev：启用开发口令认证（账号前缀白名单 + GAME_LOGIN_DEV_PASSWORD）；prod：关闭开发口令——生产口令（Argon2id）另由
    # game.login.auth.password.enabled 打开（见下方 auth 段），两者都没开时口令登录一律 2000（fail-closed）。
    # 生产部署必须显式改成 prod。配置缺省（不写这一项）时代码按 prod 处理。
    mode: dev
    dev-account-prefixes:
      - robot_
      - dev_
    max-players-per-account: 5
    worker-threads: 16
    worker-queue-capacity: 1024
    # 进游戏时等 scene-manager 分配结果的上限（Dubbo 调用本身 3s 超时，这里是兜底）。
    # 登录期重定向（GO-5，角色在别的 zone）等 scene-manager 签票也用它兜底，到点按调用失败、退化为在入口 zone 按首登进游戏。
    scene-assign-timeout: 5s
    # 进游戏夺取数据归属时，上一个写者（旧实例）还没写回释放：请它让出并等待的上限，之后回 2005。
    owner-claim-wait: 3s
    # 一次 EnterGame 的时间预算（从 login 处理器开始算）：上面两项的等待都按它的剩余收紧，用完就不再调 scene-manager、不再夺权
    # （登录期重定向没成时的回落 = 签票 + 分配 + 夺权，三段加起来也不超过它）。必须小于 gate 调 login 的 Dubbo 超时
    # （game-gate dubbo.consumer.timeout 5s）：gate 到点回 1003 之后迟到的应答被丢弃，那时夺到的归属没人接，玩家要等租约 30s 过期。
    enter-game-budget: 4s
    # access / refresh 令牌有效期（基线 2h / 720h）；令牌存 Redis，全服共用、不分 zone。
    access-token-ttl: 2h
    refresh-token-ttl: 720h
    # 旧 refresh 被轮换后仍可重放的宽限窗口（基线 TokenConfig.RefreshReuseGrace）：窗口内同一旧 refresh 再来、且新 refresh 还没用过，
    # 返回同一对新令牌（回包丢失后的重试不必重新登录）。0 = 严格一次性；上限 60s，越界拒绝启动。
    refresh-reuse-grace: 30s
    # 窗口外重放已轮换的旧 refresh 视为泄漏信号，吊销它所在的令牌家族（那次登录的整条令牌线，含 access；同账号其他登录不受影响）。
    # false = 只观测：照常检测、记日志，不吊销。不要与 refresh-reuse-grace: 0 同时开：那样同一请求并发两次就会触发吊销。
    # 基线 TokenConfig.RefreshReuseRevoke；见 mmorpg docs/design/dual-token-authentication.md「令牌家族、重用检测与家族吊销」。
    refresh-reuse-revoke: true
    # 每账号处于「已登录（TCP Login）、未进游戏」窗口的连接上限（基线 3，超出回 2024），与一次登记的有效期（没注销干净的按它自愈）。
    max-devices-per-account: 3
    device-session-ttl: 30m
    # 认证（同 mmorpg login.yaml 的 PasswordAuth / AuthProviders）：没写的一项 = 不启用。秘密只从环境变量读。
    # auth:
    #   # 生产口令认证：读 account.password_hash 的 Argon2id（存量账号的哈希用 PasswordAdmin 工具写）；与 mode=dev 互斥
    #   password:
    #     enabled: true
    #     kdf-concurrency: 2      # 每次 KDF 占 64 MiB，上限 8
    #     kdf-wait: 500ms         # 等槽上限，最多 5s
    #   satoken:                  # Sa-Token 认证服务的 Redis（口令取环境变量 GAME_SATOKEN_REDIS_PASSWORD）
    #     redis-address: redis://127.0.0.1:6379
    #     database: 0
    #     token-name: satoken
    #     login-type: login
    #   wechat:                   # app secret 取环境变量 GAME_WECHAT_APP_SECRET
    #     app-id: wx...
    #     endpoint: ""            # 空 = https://api.weixin.qq.com；可指向本地假服务（http 只在 mode=dev 放行）
    #     require-union-id: true  # 缺省 true：没返回 unionid 就拒绝登录（故障码），不回落 openid
    #   qq:
    #     app-id: "100000001"
    #     endpoint: ""            # 空 = https://graph.qq.com
    #     request-union-id: true  # 缺省 true：请求带 unionid=1；写 false 时 require-union-id 也必须写 false
    #     require-union-id: true
    #   netease:
    #     enabled: true           # 占位，恒失败（同基线）

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    # 同机多个 Dubbo 进程会抢 QoS 端口 22222。
    qos-enable: false
  protocol:
    name: tri
    port: 20881
    host: ${game.advertise-host}
  registry:
    address: N/A
  provider:
    timeout: 10000
  consumer:
    check: false
