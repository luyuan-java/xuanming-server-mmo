# game-chat 默认（local）配置：Dubbo 直连、不需要 Nacos 服务端。用 Nacos 做注册中心时加 --spring.profiles.active=nacos。
#
# 秘密只从环境变量注入，不写进本文件：
#   GAME_DUBBO_SECRET        Dubbo 调用方鉴权密钥（必填，与 game-gate 一致；缺失即拒绝启动）
#
# 正式聊天读写只认SQL原件；Redis历史列表不再承担聊天真相或强读选择。
spring:
  application:
    name: game-chat
  main:
    web-application-type: servlet
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # 与玩家归属/路由在同一SQL域；先显式安装db/chat-authority.sql及既有player/route迁移。
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/${game.namespace:game}?useUnicode=true&characterEncoding=UTF-8
    username: ${GAME_MYSQL_USERNAME:root}
    password: ${GAME_MYSQL_PASSWORD:}
    druid:
      initial-size: 0
      max-active: 8
      max-wait: 1000
      connect-timeout: 3000
      socket-timeout: 5000
  sql:
    init:
      mode: never

# 管理端点：http://127.0.0.1:18108/actuator/health 与 /actuator/prometheus。
server:
  port: 18108
  address: ${GAME_MANAGEMENT_ADDRESS:127.0.0.1}
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

game:
  # 可选Redis热关停默认关闭，避免SQL聊天被Redis启动可用性绑定；需要时由部署显式开启。
  killswitch:
    enabled: false
  advertise-host: 127.0.0.1
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  chat:
    require-tidb: true
    # 缺省值同 mmorpg go/chat（etc/chat.yaml）。
    max-content-bytes: 512
    rate-limit-per-second: 5
    history-max-entries: 200
    history-ttl: 7d
    history-default-limit: 20
    history-max-limit: 50
    request-id-ttl: 60s
    request-budget: 3500ms

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: false
  protocol:
    name: tri
    port: 20884
    host: ${game.advertise-host}
  registry:
    address: N/A
  provider:
    timeout: 10000
  consumer:
    check: false
