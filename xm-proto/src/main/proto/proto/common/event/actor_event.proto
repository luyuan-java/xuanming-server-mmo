syntax = "proto3";
option java_package = "com.game.proto.common.event";
option java_multiple_files = true;
option go_package = "common/event";



message InitializeActorCompsEvent
{
  uint64 actor_entity = 1;
}

message InterruptCurrentStateEvent
{
  uint64 actor_entity = 1;
  uint32 actor_action = 2;
  uint32 actor_state = 3;
}