syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonEventBuffEventOuterClass";
option java_multiple_files = true;
option go_package = "common/event";





message BuffTestEvent
{
  uint64 period = 1;
  uint64 periodic_timer = 2;
  uint32 period_done = 3;
}