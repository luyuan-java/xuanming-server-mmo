syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonComponentPlayerSkillCompOuterClass";
option java_multiple_files = true;
option go_package = "common/component";



message PlayerSkillComp {
  uint64 id = 1; 
  uint32 skill_table_id = 2; 
}

message PlayerSkillListComp {
  repeated PlayerSkillComp skill_list = 1;
}