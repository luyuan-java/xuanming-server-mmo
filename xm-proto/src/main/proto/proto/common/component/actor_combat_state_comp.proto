syntax = "proto3";
option java_package = "com.game.proto.common.component";
option java_multiple_files = true;
option go_package = "common/component";



enum eCombatState
{
	kSilence = 0;
}

message CombatStateDetailsComp 
{
    map<uint64, bool> sources = 1;
}

message CombatStateCollectionComp 
{
    map<uint32, CombatStateDetailsComp> states = 1;
}
