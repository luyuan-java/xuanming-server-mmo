syntax = "proto3";
option java_package = "com.game.proto.common.component";
option java_multiple_files = true;
option go_package = "common/component";



message PlayerSceneInfoComp
{
  uint32 scene_config_id = 1;
  uint32 guid = 2;
}

message PlayerSceneContextComp
{
	PlayerSceneInfoComp scene_info = 1;
	PlayerSceneInfoComp scene_info_last_time = 2;
}

