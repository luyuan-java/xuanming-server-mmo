syntax = "proto3";

// 玩家在线状态的持久化载体：Java 版自有格式，不与 mmorpg 共享（两版各有库表，不混部）。
// 存在 player_state.data（MEDIUMBLOB），与 player 行在同一个事务里、同一个 owner_epoch 围栏下写入。
//
// 演进规则（存量数据靠它向前兼容）：
//   - 每个玩法一个字段，只增不改；字段号一经使用不复用，删字段写 reserved。
//   - 各玩法数据内部同样只增不改；读到默认值（老数据没有这段）必须是「初始状态」的合法表示。
//   - 不放在 player 表里有独立列的字段（等级、场景、坐标），避免两处真相。

package game.storage;

option java_package = "com.game.player.store.state";
option java_multiple_files = true;

message PlayerState {
  // 朝向：最近一次移动上报的 rotation；没有上报过时不设（进场后不带朝向，与基线一致）。
  Facing facing = 1;
  // 货币。
  CurrencyState currency = 2;
  // 属性加点：方案与已分配点。点数总量（按等级与表换算）、二级属性都不落库，每次加载重算。
  AttributeState attribute = 3;
  // 背包（四个固定包：0 人物背包、1 仓库、2 装备栏、3 临时格，同 mmorpg BagType）。
  BagState bag = 4;
  // 任务（mmorpg QuestAllData 的 Java 自有对应；只有 scope 0 可操作，不存 scope 层）。
  MissionState mission = 5;
  // 当前气血 / 法力（mmorpg BaseAttributesComp.health / mana 的 Java 自有对应；力量 / 护甲等成长属性不存，用到时由职业表即时算出）。
  // 没有这段 = 满血满蓝（新号、2.7 之前的存档、或写盘那一刻正好满）：进场按上限回满，与基线新号回满同义。
  Vitals vitals = 6;
  // 宝宝（mmorpg PlayerPetComp 的 Java 自有对应）。没有这段 = 没有宝宝、未出战。
  PetState pets = 7;
  // 通用资产通道的幂等账本（mmorpg PlayerAssetOpLedgerComp 的 Java 自有对应），与资产同一份记录、同一次围栏写：
  // 扣款 / 发放与「这条 seq 已经处理过」原子落盘。没有这段 = 从没收到过资产通道请求。
  AssetOpLedgerState asset_ledger = 8;
  // 回合制战斗结算幂等账本（mmorpg BattleSettlementLedgerComp 的 Java 自有对应，scene-battle-spec §7.12）：只登记「已应用、销账未确认」的局，
  // 稳态 0~1 条，上限 64 是异常兜底。与资产同一份记录、同一次围栏写——「这一局已应用」与资产同生共死。没有这段 = 没有待销账的局。
  BattleLedgerState battle_ledger = 9;
  // 玩家持久收件箱的消费账本（mmorpg PlayerInboxLedgerComp 的 Java 自有对应，mmorpg docs/design/player-inbox-service.md §4.4）：
  // 每个域「按 seq 升序已处理到哪」与最近 32 条结局，与 GM 处置的效果（currency.blocked_types 等）同一份记录、同一次围栏写。
  // 没有这段 = 从没消费过收件箱。回档不改它（与 blocked_types 同口径：处置状态不是资产，见 game-data RestoreBuilder）。
  InboxLedgerState inbox_ledger = 10;
  // 已学技能与真实存储重数；与货币在同一 PlayerState、同一 owner_epoch 围栏事务提交。
  PlayerSkillBookState skills = 11;
  // 角色形象永久已拥有位图、1 小时免费试用位图、在途试用态与幂等回执（永久形象存于 player.appearance_id，同事务围栏提交）。
  AppearanceState appearance = 12;
  // 个人物品获取封锁清单（GM 收件箱类型 5 / 6，与背包同事务围栏提交）。
  ItemGainBlockState item_gain_block = 13;
  // 活动中心活跃度账本（一次性任务去重位图、当期积分来源与已结束周期最近 64 条领取记录，同事务围栏提交）。
  ActivityVitalityState activity_vitality = 14;
  // 本人近期战斗结果（至多 10 条，结算应用同帧写入、确认落盘后对客户端公开）。
  BattleResultHistoryState battle_results = 15;
  // 客户端请求幂等键账本（至多 32 条 + 装备打造水位 + 装备材料自选账本，同事务围栏提交）。
  ClientRequestLedgerState client_request_ledger = 16;
  // 神秘商人个人限购记录（仅记当前一轮，同事务围栏提交）。
  PlayerMysteryMerchantState mystery_merchant = 17;
  // 单槽赛季印存档记录（按 season_id 索引，保留历史赛季记录与未知字段，同事务围栏提交）。
  PlayerSeasonState season = 18;
  // 五行试炼志 V2 永久位图、最佳回合手记、卷三赛季隔离档案与普通首领首通门禁（同事务围栏提交）。
  PlayerTrialJournalState trial_journal = 19;
  // 轻量化手艺熟练度、未学技能书架、永久解锁技能与宗师原子代打配置（同事务围栏提交）。
  PlayerCraftState craft = 20;
  // 瑞兽迎春限时活动期次胜场、永久待领资格、终身领取回执与在途开局恢复状态（同事务围栏提交）。
  PlayerFestivalBeastState festival_beast = 21;
  // 官方灵石百宝阁个人与共享组限购记录（同事务围栏提交）。
  PlayerSpiritShopState spirit_shop = 22;
  // 角色累计总经验（与 player.level 列同事务围栏提交，1..85 平滑升级曲线）。
  PlayerProgressionState progression = 23;
  // 青云游历手记双轨进度、已解锁典藏与零战力纪念外显（同事务围栏提交）。
  PlayerTravelPassState travel_pass = 24;
}

