  repeated ActivityClaimRecordState claims = 3;
}

message ActivityPointSourceState {
  uint32 mission_scope = 1;
  uint32 mission_id = 2;
  uint32 rule_id = 3;
  uint64 configuration_revision = 4;
  uint64 period_id = 5;
  uint32 points = 6;
}

message ActivityClaimRecordState {
  uint32 rule_id = 1;
  uint64 configuration_revision = 2;
  uint64 period_id = 3;
  uint32 threshold_id = 4;
  string request_id = 5;
  uint32 reward_id = 6;
  uint64 claimed_at_ms = 7;
}

message AppearanceState {
  bytes trial_used_bits = 1;
  string trial_appearance_id = 2;
  uint64 trial_expires_at = 3;
  uint64 switch_seq = 4;
  repeated AppearanceRequestReceipt recent_requests = 5;
  // 永久已拥有形象位图（按 CharacterAppearance 主键 bit_index 紧凑低位在前）；当前永久 player.appearance_id 隐式视为已拥有。
  bytes owned_bits = 6;
  // 灵宠幻化永久拥有位图（按 PetCosmetic 主键 bit_index 紧凑低位在前）。
  bytes pet_cosmetic_owned_bits = 7;
  // 技能特效永久拥有位图（按 SkillVfxCosmetic 主键 bit_index 紧凑低位在前）。
  bytes skill_vfx_owned_bits = 8;
  // 技能特效穿戴映射（skill_table_id -> SkillVfxCosmetic.id；按无符号键升序写出）。
  map<uint32, uint32> equipped_skill_vfx = 9;
}

message AppearanceRequestReceipt {
  uint64 client_request_id = 1;
  uint32 kind = 2; // 1 = SwitchAppearance(unlock/free), 2 = StartAppearanceTrial, 3 = SwitchAppearance(expect_free_switch)
  string target_appearance_id = 3;
  uint64 seq = 4;
}

message SkillLoadoutSchemeState {
  uint32 scheme_id = 1;
  uint32 role_tag = 2;
  repeated uint32 passive_skill_ids = 3;
  repeated uint32 pursuit_skill_ids = 4;
  repeated uint32 opening_skill_ids = 5;
}

message PlayerSkillBookState {
  repeated PlayerSkillEntry entries = 1;
  uint32 active_loadout_scheme_id = 2;
  repeated SkillLoadoutSchemeState loadout_schemes = 3;
  uint64 loadout_state_version = 4;
  string loadout_last_request_id = 5;
  uint64 loadout_last_base_version = 6;
  uint32 loadout_last_scheme_id = 7;
}

message PlayerSkillEntry {
  uint32 skill_id = 1;
  // 原样保留，生效时按本版职业、等级与表上限解释；未知技能和零重数不删除。
  uint32 rank = 2;
}

// 收件箱消费账本：每个域一条游标，按 domain 无符号升序写出（周期存盘按值比对，顺序必须确定；查找一律按 domain 字段，不靠下标）。
message InboxLedgerState {
  repeated InboxDomainCursorState cursors = 1;
}

// 一个域（PlayerInboxDomain）的游标。
message InboxDomainCursorState {
  uint32 domain = 1;
  // 已按 seq 升序处理到这里（含）；seq 只增，0 = 这个域还没处理过任何条目。
  uint64 decided_through_seq = 2;
  // 最近结局环：按 seq 严格升序、都不超过 decided_through_seq，至多 32 条（超出挤掉最旧的）；重复投递时按它回放原结局。
  repeated InboxDecisionState recent = 3;
}

// 一条已定的结局（mmorpg PlayerInboxDecision 的 Java 自有对应）。
message InboxDecisionState {
  uint64 seq = 1;
  // PlayerInboxOutcome：只有 APPLIED / REJECTED / SKIPPED 进环（UNKNOWN 只确认、不入环）。
  uint32 outcome = 2;
  // REJECTED：消费方给的 tip id；SKIPPED：PlayerInboxVoidReason；APPLIED：0。
  uint32 reason = 3;
  // 回放前核对（同 seq 的 request_id 与 msg_type 都要一致），也供对账。
  uint64 request_id = 4;
  uint32 msg_type = 5;
}

// 回合制战斗结算账本：按 battle_id 无符号升序写出（周期存盘按值比对，顺序必须确定）。
message BattleLedgerState {
  repeated BattleLedgerEntry applied = 1;
}

message BattleLedgerEntry {
  uint64 battle_id = 1;
  // 应用时刻（UTC 毫秒）：只用于满员淘汰与排障。
  uint64 applied_at_ms = 2;
}

// 资产通道账本：每条流一本，按流号升序。
message AssetOpLedgerState {
  repeated AssetOpStreamLedgerState streams = 1;
}

// 一条流的账本：1024 位窗口覆盖 (watermark, watermark + 1024]，位 i ↔ seq = watermark + 1 + i（第 i / 64 个字的第 i % 64 位）。
message AssetOpStreamLedgerState {
  // 流号（1 帮会扣、2 帮会发、3 交易扣、4 交易发、5 系统发）。
  uint32 stream = 1;
  uint64 watermark = 2;
  // 已见 / 已应用位图，各恰好 16 个字；applied ⊆ seen，已见未应用 = 已拒。
  repeated fixed64 seen_bits = 3;
  repeated fixed64 applied_bits = 4;
  // 窗口内被拒 seq 的原因（只收非 0 原因，按 seq 升序，至多 64 条）。
  repeated AssetOpRejectionState rejections = 5;
  // 本纪元见过的最大 seq（跳号上限的基准）。
  uint64 max_seq = 6;
  // 流纪元（调用方建这本 seq 时的毫秒）；更大的纪元整条流重置。
  uint64 stream_epoch = 7;
  // 窗口内部分发放的 seq（按升序，保留完整1024窗口，不按结果条数提前丢弃）。
  repeated uint64 partial_seqs = 8;
  repeated AssetOpReceiptState receipts = 9;
}

// 与效果/结局同事务保存；snapshot_proto是Java内部AssetSnapshot原始字节。
message AssetOpReceiptState {
  uint64 seq = 1;
  bytes request_digest = 2;
  bytes snapshot_proto = 3;
  uint64 correlation_id = 4;
}

message AssetOpRejectionState {
  uint64 seq = 1;
  uint32 reason_tip_id = 2;
}

// 宝宝：实例按获得顺序；二级属性与点数总量不落库（按资质 + 已分配 + 等级现算）。
message PetState {
  repeated PetEntry pets = 1;
  // 出战中的宝宝；0 = 未出战。
  uint64 active_pet_id = 2;
  // 最近一次成功购买的持久回执，重试只返原结果。
  uint64 last_purchase_sequence = 3;
  uint32 last_purchase_pet_table_id = 4;
  uint64 last_purchase_pet_id = 5;
  uint64 last_purchase_price_gold = 6;
  // true = 已完成一次性起步灵狐判定（已发放或老号已有宠不再补发）。
  bool starter_pet_granted = 7;
}

message PetEntryPresetState {
  uint32 slot_id = 1;
  uint32 tag = 2;
  map<uint32, uint32> allocated = 3;
}

// 一只宝宝（mmorpg PetInstance 的 Java 自有对应）。
message PetEntry {
  // 全服唯一的雪花号（场景节点在全服号段租约上发，与物品同一个号源）。
  uint64 pet_id = 1;
  // 种类（Pet 表 id）。
  uint32 pet_table_id = 2;
  // 玩家改的名字；空 = 用 Pet.name。
  string name = 3;
  // 等级（= min(主人等级, Pet.level_cap)，每次重算同步；存下来供离线展示与加载时按旧等级换算当前值）。
  uint32 level = 4;
  // 维度号 → 已分配点（只存非 0）。
  map<uint32, uint32> allocated = 5;
  // 维度号 → 资质（万分比，10000 = 100%），出生时在 Pet.aptitude_min / max 之间随机，之后不变；缺键按 10000。
  map<uint32, uint32> aptitude = 6;
  // 当前气血 / 法力（回合制战斗结算回写，残血跨登录保留）。
  uint64 health = 7;
  uint64 mana = 8;
  // 获得时间（Unix 秒）。
  uint64 created_at = 9;
  // 实例学会的技能（技能书是二期，恒空；种类自带技能不抄进实例）。
  repeated uint32 skill_table_ids = 10;
  // 旧存档种类技能及已学 ID 缺少等级时按一重。未知 ID 保留原值。
  map<uint32, uint32> skill_ranks = 11;
  // 条目点和四维分离；序号回执与分配同一玩家事务持久化。
  map<uint32, uint32> entry_allocated = 12;
  uint64 entry_state_version = 13;
  string entry_last_request_id = 14;
  uint64 entry_last_base_version = 15;
  uint32 entry_last_config_version = 16;
  map<uint32, uint32> entry_last_target = 17;
  uint32 cultivation_tier = 18;
  uint32 active_entry_preset_slot = 19;
  repeated PetEntryPresetState entry_presets = 20;
  uint64 tier_last_request_id = 21;
  uint32 tier_last_expected_tier = 22;
  uint32 tier_last_result_tier = 23;
  uint32 entry_last_preset_slot = 24;
  uint32 entry_last_preset_tag = 25;
  // 当前穿戴的灵宠幻化配置 ID（0 = 灵宠原形；纯外观零数值）。
  uint32 cosmetic_id = 26;
}

// 当前气血 / 法力。health == 0 = 阵亡：进场按上限回满（基础复活）；活着的进场只按新上限往下夹，不补。
message Vitals {
  uint64 health = 1;
  uint64 mana = 2;
}

// 背包（mmorpg BagAllData 的 Java 自有对应；基线的动态包没有生产创建点，不存）。
message BagState {
  // 各背包容量，下标 = bag_type；缺的项或 0 = 取当前版本的缺省容量（100 / 200 / 10 / 200）。
  // 只在有包不是缺省容量时才写（目前没有扩容入口，所以总是空），缺省容量的包写 0：以后调高缺省容量，老玩家也一并生效。
  // 下标 4 起是本版本不认识的背包的容量，原样保留、写回。
  repeated uint32 capacities = 1;
  // 全部物品实例，按 (bag_type, pos) 升序写出（周期存盘按值比对脏数据，顺序必须确定）。
  repeated BagItemState items = 2;
}

// 一个物品实例（mmorpg ItemEntry 的 Java 自有对应）。
message BagItemState {
  // 实例 guid：全服唯一的雪花号（场景节点在全服号段租约上发），永不为 0。
  uint64 item_uuid = 1;
  uint32 config_id = 2;
  // 堆叠数（不可叠加物品恒为 1）。
  uint32 stack_size = 3;
  // 格子号；装备栏里就是 EquipSlot.id。
  uint32 pos = 4;
  // 所在背包（0–3）；本版本不认识的值原样保留、写回（滚动升级 / 回滚期间不丢东西）。
  uint32 bag_type = 5;
  // 入包序号（临时格先进先出淘汰的依据）；0 = 老数据，加载时按出现顺序补盖。
  uint64 acquire_seq = 6;
  // presence 表示已初始化，即使随机属性为空。恢复、穿脱与资产搬运不得重掷。
  EquipmentState equipment = 7;
  // 仅自用绑定标记：true = 不可交易、不可寄售、不可赠送；与可交易分堆隔离。
  bool bound = 8;
}

// Java 自有装备存档；显示名、上限与现算加成不落库，未知字段沿实例完整保留。
message EquipmentState {
  repeated EquipmentAffixState affixes = 1;
  uint32 enhance_level = 2;
  repeated EquipmentGemState gems = 3;
  repeated EquipmentFixedAffixState fixed_affixes = 4;
  uint32 enhance_pity_count = 5;
  string crafter_name = 6;
  uint64 crafter_player_id = 7;
}
message EquipmentFixedAffixState {
  uint32 slot = 1;
  uint32 affix_id = 2;
  uint32 quality_tier = 3;
  uint32 polish_pity_count = 4;
}
message EquipmentAffixState {
  uint32 attr_id = 1;
  uint32 tier = 2;
  uint32 value = 3;
  uint32 seq = 4;
}
message EquipmentGemState {
  uint32 socket = 1;
  uint32 gem_config_id = 2;
}

message CurrencyState {
  // 下标 = 币种（0 银两、1 灵石、2 绑定灵石、3 绑定银两，同 mmorpg kCurrency*）；缺的槽按 0。
  repeated uint64 balances = 1;
  // GM 封禁获取的币种（按封禁先后）。
  repeated uint32 blocked_types = 2;
  // 补缴欠款（mmorpg CurrencyComp.debts 的 Java 自有对应），按币种升序：之后到账的该币种收入先抵欠款。
  // 目前没有任何写入入口（同基线：GM 挂欠款随路线图 7.2），只会来自存档。
  repeated CurrencyDebtState debts = 3;
}

// 一笔补缴欠款。
message CurrencyDebtState {
  uint32 currency_type = 1;
  // 欠款总额与已抵扣额；剩余 = owed − paid，还清即删。
  uint64 owed = 2;
  uint64 paid = 3;
  // GM 冻结：暂停自动抵扣。
  bool frozen = 4;
  // 到期时间（Unix 秒，0 = 不过期）；过期后不再抵扣（不删）。
  uint64 expires_at = 5;
  string reason = 6;
  string gm_operator = 7;
  uint64 created_at = 8;
}

message Facing {
  double x = 1;
  double y = 2;
  double z = 3;
}

// 属性加点（mmorpg PlayerAttributeComp 的 Java 自有对应；基线的额外点 bonus_points / 外部加成 bonus_values 没有写入方，暂不存）。
message AttributeState {
  // 加点方案，按创建先后（面板按这个顺序列出）。
  repeated AttributeScheme schemes = 1;
  // 当前生效方案；0 = 未初始化（加载时补默认方案）。
  uint32 active_scheme_id = 2;
  // 方案 id 自增游标（id 不复用）；0 = 未初始化（加载时取已有最大 id + 1）。
  uint32 next_scheme_id = 3;
  // 上次切换方案的 Unix 秒（切换冷却）。
  uint64 last_switch_time = 4;
}

message AttributeScheme {
  uint32 scheme_id = 1;
  string name = 2;
  // dimension_id → 已分配点（只存非 0；所属池由表 AttributeDimension 决定）。
  map<uint32, uint32> allocated = 3;
}

// 任务状态。三个列表都按 mission_id 无符号升序写出（周期存盘按值比对脏数据，顺序必须确定）；
// 表里已删除的任务 id 照样保留（列表里显示 configured=false）。
message MissionState {
  // 进行中的任务。
  repeated ActiveMission active = 1;
  // 已完成的任务（终态，不会重开）。
  repeated uint32 completed_ids = 2;
  // 可领奖的任务（正常应 ⊆ completed_ids；不一致时 195 回 1002，同基线）。
  repeated uint32 claimable_ids = 3;
}

message ActiveMission {
  uint32 mission_id = 1;
  // 下标 = Mission.condition_id 的下标（顺序任务靠它定位当前格）；与表里条件数不一致时永不推进、永不完成（同基线，不修补）。
  repeated uint32 progress = 2;
  // 接取时刻（UTC 毫秒，基线 mission_begin_time；客户端不可见，完成后不再保留）。
  uint64 accepted_at_ms = 3;
}
