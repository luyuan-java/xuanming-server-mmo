# xm-scene 本地配置。进程从仓库根目录启动（配置表默认读 config-data/tables）。
# 环境变量（秘密只从这里注入，不进仓库）：
#   XM_NODE_LINK_SECRET gate → scene 节点链路握手密钥（必填，须与 xm-gate 一致；缺失即启动失败）
#   XM_DUBBO_SECRET    Dubbo 调用方鉴权密钥（必填：资产通道的 Dubbo 提供方要验调用方 MAC；须与 xm-guild 等一致；缺失即启动失败）
#   XM_ASSET_OP_SECRET_GUILD / XM_ASSET_OP_SECRET_TRADE
#                      资产通道请求体签名的调用方密钥（去首尾空白后 ≥ 32 字节；须与 xm-guild / 交易注入同一个值；
#                      没配的调用方的资产请求一律验签失败，启动时报一次 ERROR）
#   DUBBO_IP_TO_BIND   资产通道 Dubbo 端口绑定的网卡（Dubbo 不接受回环，缺省监听全部网卡；生产绑内网网卡并配防火墙）
#   XM_MYSQL_USER      MySQL 用户（默认 root）
#   XM_MYSQL_PASSWORD  MySQL 密码（本机无密码的 root 可不设；与 xm-login 同口径）。
#                      注意：Spring Boot 绑定属性时不会因占位符无法解析而失败，所以这里必须带空默认值，
#                      否则未设置时会把字面量 "${XM_MYSQL_PASSWORD}" 当密码发给 MySQL。
#                      密码错时启动阶段 Druid 建初始连接即失败（fail-fast）。
spring:
  application:
    name: xm-scene
  main:
    # 只为管理端点起一个 Servlet 容器（Tomcat）；gate 节点链路（Netty）不经过它（architecture.md §11）。
    web-application-type: servlet
  lifecycle:
    # 停服写回（xm.scene.shutdown-save-timeout）要在这个上限之内完成
    timeout-per-shutdown-phase: 30s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # connect / socket 超时给阻塞 I/O 设上界（与 xm-login 同口径）：数据库卡死时存储线程不会被无限挂住，
    # 写回在重试预算内失败并记 ERROR，停服也不会卡在等写回上。
    url: "jdbc:mysql://127.0.0.1:3306/xm_java?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=10000"
    username: ${XM_MYSQL_USER:root}
    password: ${XM_MYSQL_PASSWORD:}
    druid:
      # 与存储线程数（xm.scene.storage-threads）匹配，多给一点余量
      initial-size: 2
      min-idle: 2
      max-active: 8
      max-wait: 3000
  sql:
    init:
      # 表结构只由 xm-login 初始化（xm-player-store 的约定），场景节点只读写
      mode: never

# 管理端点：http://127.0.0.1:18104/actuator/health 与 /actuator/prometheus；另有 GM 签名停机 /gm/identity、/gm/graceful-shutdown
# （只收本机来的请求，XM_GM_ALLOW_REMOTE=true 才放开；密钥 XM_GM_ADMIN_SECRET，没配一律拒），没有别的业务接口。
# 默认只绑本机；要被别的机器上的 Prometheus 抓取时用 XM_MANAGEMENT_ADDRESS 指定内网地址（不要暴露到公网）。
# 端口可用 SERVER_PORT 覆盖（同机起多个 scene 实例时必须各不相同，与 link-port 一样；Windows 上避开保留端口段 50060-50159）。
server:
  port: 18104
  address: ${XM_MANAGEMENT_ADDRESS:127.0.0.1}
  # 管理端口上没有需要排空的业务请求。
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

xm:
  zone-id: 1
  # 资产审计（流水发往 Kafka，xm-data 消费落库）。topic 代次必须与 xm-data 一致；enabled: false 时只写本地审计日志
  audit:
    enabled: ${XM_AUDIT_ENABLED:true}
    bootstrap-servers: ${XM_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    topic-generation: ${XM_AUDIT_TOPIC_GENERATION:1}
  # 运行模式：只有 dev / test 放行 GM 类客户端指令（Gm* / Debug* / Test*），其余一律按 prod 拒绝（与 gate 同一个环境变量）
  run-mode: ${XM_RUN_MODE:prod}
  advertise-host: 127.0.0.1
  table-dir: config-data/tables
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  scene:
    # 链路握手有共享密钥鉴权（XM_NODE_LINK_SECRET），但链路不加密、窗口内握手可重放：默认只绑本机；
    # 多机部署改内网地址，仍要靠网络隔离保证只有 gate 能连
    link-bind-host: 127.0.0.1
    link-port: 21000
    link-io-threads: 2
    link-handshake-timeout: 10s
    storage-threads: 4
    storage-queue-capacity: 10000
    # 停服写回的总预算：写回任务在逻辑线程上排队 + 落库共用这一个上限
    shutdown-save-timeout: 15s
    # 每条 gate 链路投递给逻辑线程还没执行完的帧数上限，到了就暂停读这条链路（背压），降到一半恢复
    link-max-pending-frames: 10000
    # 通用资产通道（帮会 / 交易经 Dubbo Triple 按节点直连调进来，register = false）：端口导出成功后写进节点目录的 rpc_port；
    # 同机起多个 scene 实例时必须各不相同（与 link-port 一样，可用 XM_SCENE_ASSET_RPC_PORT 覆盖）
    asset-rpc-port: ${XM_SCENE_ASSET_RPC_PORT:21100}
    # 资产通道在途调用上限：超出直接回过载（调用方按传输失败重投），不排队进逻辑线程；应 ≥ 调用方副本数 × Workers + 同步投递并发
    asset-op-max-inflight: 256
    # 回合制战斗入口（SceneBattleService，与资产通道同一个端口、group scene-battle）的在途上限：超出回 OVERLOADED（零副作用），与资产通道各自独立
    battle-rpc-max-inflight: 256
    # 回合制战斗（scene-battle-spec §8）：reaper 间隔缺省 30s（同基线），只许调小（0 < 值 ≤ 30s）；本机切片设 2s 供 robot 用
    battle:
      reaper-interval: ${XM_SCENE_BATTLE_REAPER_INTERVAL:30s}
    # 在线周期存盘：每人每周期至多写一次（没变化不写），0 = 只在离场时写回（基线 SCENE_PLAYER_SAVE_INTERVAL_SECONDS 缺省 300）
    save-interval: ${XM_SCENE_SAVE_INTERVAL:300s}
    # 全服产出封禁名单（Redis，xm-data 运维接口写）的兜底重读周期；变更通知走 pub/sub、秒级生效
    gain-block-refresh: 10s
    # 主世界频道计划（scene-manager 写在 Redis xm:world:{z:<zone>}:*）的拉取周期：每周期读一次版本号，变了才整读并在逻辑线程上建 / 排空频道
    channel-plan-poll-interval: 1s
    # 跨节点换图交出归属要求的剩余租约下限 M：须在续约周期 10s 与 租约 30s − 续约周期 = 20s 之间（不含端点），否则拒启。
    # 交出只在 owner_lease_until ≥ now + M 时提交；结局不明时的探测在第一次尝试起 M − 2s 内出结论（冻结时长的上界）
    transfer-lease-margin: 15s
    # 交出事务（不含提交）与探测加锁读的时限（≥ 1s 且小于 transfer-lease-margin）：行锁被占时尝试以超时失败、交给重试 / 探测
    transfer-probe-statement-timeout: 3s
    # 跨节点换图（63 的目标不在本节点）请 scene-manager 选目标的直连地址（Dubbo Triple，与 xm-login 的 xm.dubbo.scene-manager-url 同一个提供方）。
    # 本批只支持直连；同机多 scene 实例共用这一个地址。批次 5.3 起镜像 / 副本实例取号（createInstance）也走这个提供方。
    # 滚动升级顺序（dungeon-mirror-spec R7）：先升级 scene-manager 再升级 scene——旧 scene-manager 选频道不看目录的 SceneEntry.kind，
    # 会把登录分进本节点上的镜像；旧 scene-manager 没有 createInstance，建镜像调用失败推 23 {1003}（fail-closed）。
    scene-manager-url: ${XM_SCENE_MANAGER_URL:tri://127.0.0.1:20882}
    # 选目标的本地兜底超时（须大于 scene-manager 的 Dubbo 超时 3s）：到时推 23 {1003}；也是 63 在途槽（期间再发 63 回 3014）的寿命。
    # 226 跨 zone 传送的选目标（selectTravelTarget）共用它：226 到时推 23 {3027}
    switch-resolve-timeout: 4s
    # 交出墓碑存活时长：交出后与 PlayerTransfer 在链路上交叉到达的 PlayerLeave 靠它按旧 epoch 补写登出墓碑 / 重连租约
    transfer-tombstone-ttl: 30s
    # 跨 zone 传送（226，批次 5.4，zone-travel-spec §5.5）。不满足校验拒启。
    # 滚动升级顺序：scene-manager 与 gate 都先于 scene——旧 scene-manager 没有 selectTravelTarget（226 受理后推 23 {3027}，fail-closed）；
    # 旧 gate 不认识重定向帧，会把它当成非法的改绑指令（推 23 {3023} 后断开；归属已释放、数据安全，客户端重登即可）。
    travel:
      # 226 受理前「在不在队」那次读的上限（> 0 且 ≤ 5s）：到时按读失败回 3027。226 的应答上界是它 + 1s。
      # 另一条校验：team-check-timeout + switch-resolve-timeout + transfer-lease-margin + 5s 必须小于 60s（缺省 2 + 4 + 15 + 5 = 26s）
      team-check-timeout: 2s
    # 镜像 / 副本实例（批次 5.3，dungeon-mirror-spec §6.10、§7.2）：实例空置满超时进入回收宽限（不接本地新进入、目录报 draining，
    # 宽限内有在途进场到达即复活），宽限满且仍空、没有在途进场才销毁；每秒判定一次。不满足校验拒启。
    # 本机切片为 robot 提速可用环境变量把镜像超时调到 5s、宽限调到 10s（宽限下限）。
    instance:
      # 镜像空置多久进入回收宽限（≥ 0；0 = 用 idle-timeout，同基线 MirrorIdleTimeoutSeconds）
      mirror-idle-timeout: ${XM_SCENE_MIRROR_IDLE_TIMEOUT:30s}
      # 副本（及回落到它的镜像）空置多久进入回收宽限（≥ 0；0 = 不自动回收，同基线 InstanceIdleTimeoutSeconds）
      idle-timeout: ${XM_SCENE_INSTANCE_IDLE_TIMEOUT:300s}
      # 回收宽限（≥ 10s：不短于 scene-manager 软预占 TTL / login 归属等待），兜住「分配时还在 → 到达时还在」
      reclaim-grace: ${XM_SCENE_INSTANCE_RECLAIM_GRACE:30s}
      # 本节点实例数上限（1..10000）与同一玩家在本节点创建的镜像数上限（1..100）：超限 63 镜像回 3005（D19）
      max-per-node: 200
      max-per-creator: 3
    # 获取异常检测（只告警）：缺省同基线，600 秒内超过 50 次或累计超过 100000；某一维填 0 只关这一维。
    # 按币种 / 物品覆盖：currency.<币种>.* 、item.<物品配置号>.*（window / max-count / max-amount；没写的项取内置缺省）
    anomaly:
      window: 600s
      max-count: 50
      max-amount: 100000

logging:
  level:
    # Kafka 客户端（资产流水生产者）在 INFO 级别会整段打印配置，压到 WARN
    org.apache.kafka: WARN
