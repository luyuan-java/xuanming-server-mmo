# xm-data 本地配置。环境变量（秘密只从这里注入，不进仓库）：
#   XM_MYSQL_USER / XM_MYSQL_PASSWORD  MySQL 账号（与 xm-login / xm-scene 同口径；空口令时可不设）
#   XM_KAFKA_BOOTSTRAP_SERVERS        Kafka 地址（缺省 127.0.0.1:9092）
#   XM_AUDIT_TOPIC_GENERATION         审计 topic 代次（必须与 xm-scene 一致，缺省 1）
#   XM_ADMIN_TOKEN                    运维接口令牌；不设则 /admin/** 一律 503
#   XM_DATA_GM_SNAPSHOT_RETENTION     运维 / 安全快照保留期（缺省 0 = 永久）
#   XM_DATA_OPS_ENABLED               改玩家数据的运维写操作（回档执行）开关，缺省 false
#   XM_DUBBO_SECRET                   Dubbo 调用方鉴权密钥（XM_DATA_OPS_ENABLED=true 时必填：回档的帮会检查调 xm-guild）
spring:
  application:
    name: xm-data
  lifecycle:
    # 停止消费者（唤醒轮询、等线程退出）在这个上限内完成；SmartLifecycle 停在数据源销毁之前
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # useAffectedRows=true：ON DUPLICATE KEY UPDATE 的受影响行数 = 新插入的行数（重放的重复行计 0）
    url: "jdbc:mysql://127.0.0.1:3306/xm_java?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=30000&useAffectedRows=true"
    username: ${XM_MYSQL_USER:root}
    password: ${XM_MYSQL_PASSWORD:}
    druid:
      initial-size: 1
      min-idle: 1
      # 两条消费线程 + 保留期清理 + 运维查询 / 快照 / 差异 / 回收 dry-run 的事务（data-ops-spec §7.5）
      max-active: 8
      max-wait: 3000
  sql:
    init:
      # 只建本服务自己的表（CREATE TABLE IF NOT EXISTS）
      mode: always
      schema-locations: classpath:db/xm-data-schema.sql

# 管理端口：actuator（health / prometheus）+ 运维接口 /admin/**。默认只绑本机，不要暴露到公网。
server:
  port: 18106
  address: ${XM_MANAGEMENT_ADDRESS:127.0.0.1}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

xm:
  audit:
    bootstrap-servers: ${XM_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    topic-generation: ${XM_AUDIT_TOPIC_GENERATION:1}
  # 全服产出封禁名单的读写（运维接口 /admin/gain-blocks）与运维面发号租约（NodeTypes.SCENE_GUID 全服池，与 xm-scene 同池），
  # 与 xm-scene 同一个库；启动后由发号线程在后台连（连不上每 10 秒重试，不挡启动与审计消费）
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  data:
    admin-token: ${XM_ADMIN_TOKEN:}
    retention:
      # 资产流水保留期；0 = 永久保留（同 mmorpg）
      transaction-log: ${XM_DATA_TXLOG_RETENTION:0s}
      # 上下线 / 周期快照（LOGIN / LOGOUT / PERIODIC）保留期；0 = 永久保留（同 mmorpg）
      player-snapshot: ${XM_DATA_SNAPSHOT_RETENTION:0s}
      # 运维 / 安全快照（GM_MANUAL / PRE_MAINTENANCE / PRE_ROLLBACK / PRE_GM_EDIT）保留期；0 = 永久保留（撤销依据，缺省永久）。
      # 启动约束：流水保留期为 0，或不短于上下线快照保留期且后者非 0（data-ops-spec §3.7）；生产值随部署批次给出（Q11）
      gm-snapshot: ${XM_DATA_GM_SNAPSHOT_RETENTION:0s}
    ops:
      # 改玩家数据的运维写操作总开关（回档执行、取消作业；批次 7.2b）。关闭时这些接口回 503 ops_disabled，只读与 dry-run 照常。
      # 开启时 XM_DUBBO_SECRET 必填（帮会检查是 Dubbo 调用方），缺了拒绝启动。本机切片脚本设 true
      enabled: ${XM_DATA_OPS_ENABLED:false}
      # 不给玩家、只按原因 / 时间窗的全服流水查询，与全服回收的时间窗上限
      max-window: 7d
      # 夺权最长等待（kick 时含等 scene 写回释放）；> 归属租约 30 s，覆盖交出提交后、目标节点进场前无人持有的最坏情况
      claim-wait: ${XM_DATA_OPS_CLAIM_WAIT:35s}
      # 一个作业涉及的玩家上限（整区超出 422 plan_too_large，不自动拆批）
      max-players-per-job: 10000
      # 写阶段之前超时：全部释放、零写入、FAILED job_timeout；写阶段超时：写完当前玩家后停、剩下的记 not_executed——
      # 一个也没写成 FAILED job_timeout，写成了一部分 PARTIAL job_timeout
      job-timeout: 30m
      # 回档目标时刻至少早于现在多久（快照经 Kafka 落库有延迟）
      min-target-age: ${XM_DATA_OPS_MIN_TARGET_AGE:5m}
      # 作业心跳与清扫判定（心跳超过 stale-after 没更新的作业改 INTERRUPTED）
      heartbeat: 5s
      stale-after: 60s
      # 回档前查战斗锁（夺权之后、账本差集之前；dry-run 也查）一次检查全程最多等多久。到点没读完 / 读失败的玩家记单独的结局
      # battle_lock_unknown（不是 in_battle），同样不写（fail-closed）、归属照常释放。略长于 Redis 单条命令的最坏阻塞（xm.redis 缺省 4.2 s）
      battle-lock-wait: 5s
    recall:
      # 一次回收（含 dry-run）至多匹配多少行源流水；超出 422 result_truncated、零变更
      max-rows: 10000
    rollback:
      guild:
        # 帮会检查前的沉降等待与写后复查前的等待（同基线 30 s / 10 s，Q6）；本机切片脚本调小
        settle: ${XM_DATA_ROLLBACK_SETTLE:30s}
        recheck-delay: ${XM_DATA_ROLLBACK_RECHECK_DELAY:10s}
        recheck-budget: 120s
        # 检查起点 = 快照内容时刻 − 余量（[5s, 1h]）；检查预算（≤ 1h）；单次 Dubbo 调用上限
        clock-skew-margin: 300s
        check-budget: 120s
        call-timeout: 10s
  # 回档帮会检查直连的 xm-guild（GuildInternalService，Dubbo group guild）；为空 = 没有装配，回档一律 check_failed
  dubbo:
    guild-url: ${XM_DUBBO_GUILD_URL:tri://127.0.0.1:20886}

logging:
  level:
    # Kafka 客户端在 INFO 级别会整段打印配置，压到 WARN
    org.apache.kafka: WARN
