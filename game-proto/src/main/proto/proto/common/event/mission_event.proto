syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonEventMissionEventOuterClass";
option java_multiple_files = true;
option go_package = "common/event";



message AcceptMissionEvent
{
  uint64 entity = 1;
  uint32 mission_id = 2;
}

message ConditionEvent
{
  uint64 entity = 1;
  uint32 condition_type = 2;
  repeated uint32 condition_ids = 3;
  uint32 amount = 4;
}

message OnAcceptedMissionEvent
{
  uint64 entity = 1;
  uint32 mission_id = 2;
}

message OnMissionAwardEvent
{
  uint64 entity = 1;
  uint32 mission_id = 2;
}