syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonEventActorCombatStateEventOuterClass";
option java_multiple_files = true;
option go_package = "common/event";




message CombatStateAddedEvent 
{
    uint64 actor_entity = 1;
    uint64 source_buff_id = 2;
	uint32 state_type = 3;
}

message CombatStateRemovedEvent 
{
    uint64 actor_entity = 1;
    uint64 source_buff_id = 2;
	uint32 state_type = 3;
}
