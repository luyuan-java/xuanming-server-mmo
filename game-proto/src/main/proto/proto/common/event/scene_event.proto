syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonEventSceneEventOuterClass";
option java_multiple_files = true;
option go_package = "common/event";



message OnSceneCreated
{
  uint64 entity = 1;
}

message OnSceneDestroyed
{
  uint64 entity = 1;
}

message BeforeEnterScene
{
  uint64 entity = 1;
}

message AfterEnterScene
{
  uint64 entity = 1;
}

message BeforeLeaveScene
{
  uint64 entity = 1;
}

message AfterLeaveScene
{
  uint64 entity = 1;
}

message S2CEnterScene
{
  uint64 entity = 1;
}
