syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonComponentTimeCompOuterClass";
option java_multiple_files = true;
option go_package = "common/component";



message TimeMeterComp
{
  uint64 start = 1;
  uint64 duration = 2;
}

message CooldownTimeComp
{
  uint64 start = 1;
  uint32 cooldown_table_id = 2;
}

message CooldownTimeListComp
{
  map<uint32, CooldownTimeComp> cooldown_list = 1;
}