syntax = "proto3";
option java_package = "com.game.proto";
option java_outer_classname = "CommonComponentItemCompOuterClass";
option java_multiple_files = true;
option go_package = "common/component";

// Player-level item acquisition block list.
// Persisted per player — survives logout/login.
// Runtime check: Bag::IsItemBlocked() reads from this.
message PlayerItemBlockComp
{
  // Item config IDs that are blocked from acquisition.
  repeated uint32 blocked_item_config_ids = 1;
}
