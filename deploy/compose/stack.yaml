# 完整 Java 开发栈：同一 TiDB 权威域，全部 17 个服务进程 + robot 工具镜像。
# dev 固定在本文件；不可把单 PD/TiKV/Redis/Kafka 形态当成生产或故障耐久验收。
# docker compose -f deploy/compose/stack.yaml --profile tools build
# docker compose -f deploy/compose/stack.yaml up -d --wait --wait-timeout 600
include:
  - infra.yaml
  - tidb.yaml

x-java: &java
  init: false
  restart: "no"
  stop_grace_period: 60s
  mem_limit: 768m
  cpus: 2.0
  security_opt: ["no-new-privileges:true"]
x-common-env: &common-env
  GAME_NAMESPACE: "${GAME_NAMESPACE:?必须显式设置部署命名空间}"
  GAME_RUN_MODE: "dev"
  GAME_MANAGEMENT_ADDRESS: "0.0.0.0"
  GAME_REDIS_ADDRESS: "redis://redis:6379"
  GAME_KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus,info"
  JDK_JAVA_OPTIONS: "-Xms64m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
x-db-env: &db-env
  SPRING_DATASOURCE_URL: "jdbc:mysql://tidb:4000/${GAME_NAMESPACE:?}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectTimeout=3000&socketTimeout=10000&useAffectedRows=true"
  SPRING_DATASOURCE_USERNAME: "${GAME_NAMESPACE:?}_app"
  SPRING_DATASOURCE_PASSWORD: "${GAME_MYSQL_PASSWORD:?}"
x-health: &health
  interval: 5s
  timeout: 5s
  start_period: 60s
  retries: 60

services:
  route-init:
    image: ${GAME_IMAGE_NAMESPACE:-game-java}/game-data:${GAME_IMAGE_TAG:?}
    entrypoint: ["java", "-cp", "/app/app.jar:/app/lib/*", "com.game.data.tools.InitializeRouteAuthority"]
    command: ["--initialize-from-sql-player", "--generation", "${GAME_ROUTE_GENERATION:?必须保存独立路由世代UUID}", "--zones", "${GAME_INITIAL_ZONES:-1}", "--expect-database", "${GAME_NAMESPACE:?}"]
    environment:
      GAME_NAMESPACE: ${GAME_NAMESPACE:?}
      GAME_MYSQL_USER: ${GAME_NAMESPACE:?}_app
      GAME_MYSQL_PASSWORD: ${GAME_MYSQL_PASSWORD:?}
      GAME_ROUTE_INIT_JDBC: "jdbc:mysql://tidb:4000/${GAME_NAMESPACE:?}?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=10000"
      JDK_JAVA_OPTIONS: "-Xms32m -Xmx128m -XX:+ExitOnOutOfMemoryError"
    depends_on:
      tidb-init: {condition: service_completed_successfully}
    mem_limit: 256m
    restart: "no"

  game-scene-manager:
    <<: *java
    image: ${GAME_IMAGE_NAMESPACE:-game-java}/game-scene-manager:${GAME_IMAGE_TAG:?必须设置不可变提交标签}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: game-scene-manager
        GAME_BUILD_COMMIT: ${GAME_BUILD_COMMIT:?必须设置构建提交}
        GAME_BUILD_CONTRACT: ${GAME_BUILD_CONTRACT:?必须设置契约提交}
    environment:
      <<: [*common-env, *db-env]
      GAME_ADVERTISE_HOST: "game-scene-manager"
      GAME_DUBBO_SECRET: "${GAME_DUBBO_SECRET:?缺少 GAME_DUBBO_SECRET}"
      GAME_GATE_TOKEN_SECRET: "${GAME_GATE_TOKEN_SECRET:?缺少 GAME_GATE_TOKEN_SECRET}"
    depends_on:
      route-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18102/actuator/health/readiness > /dev/null && timeout 2 bash -c 'exec 3<>/dev/tcp/game-scene-manager/20882'"]

