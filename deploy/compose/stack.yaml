  game-battle:
    <<: *java
    image: ${GAME_IMAGE_NAMESPACE:-game-java}/game-battle:${GAME_IMAGE_TAG:?必须设置不可变提交标签}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: game-battle
        GAME_BUILD_COMMIT: ${GAME_BUILD_COMMIT:?必须设置构建提交}
        GAME_BUILD_CONTRACT: ${GAME_BUILD_CONTRACT:?必须设置契约提交}
    environment:
      <<: *common-env
      GAME_ADVERTISE_HOST: "game-battle"
      GAME_DUBBO_SECRET: "${GAME_DUBBO_SECRET:?缺少 GAME_DUBBO_SECRET}"
      GAME_BATTLE_TOKEN_SECRET: "${GAME_BATTLE_TOKEN_SECRET:?缺少 GAME_BATTLE_TOKEN_SECRET}"
      GAME_ADMIN_TOKEN: "${GAME_ADMIN_TOKEN:?缺少 GAME_ADMIN_TOKEN}"
      GAME_BATTLE_CLIENT_ADVERTISE_HOST: "${GAME_BATTLE_CLIENT_ADVERTISE_HOST:-game-battle}"
      GLOBAL_MATCH_ENABLED: "false"
    depends_on:
      route-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      game-match: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18112/actuator/health/readiness > /dev/null && timeout 2 bash -c 'exec 3<>/dev/tcp/game-battle/12000' && timeout 2 bash -c 'exec 3<>/dev/tcp/game-battle/21200'"]
    ports: ["127.0.0.1:${GAME_BATTLE_HOST_PORT:-12000}:12000"]

  game-gate:
    <<: *java
    image: ${GAME_IMAGE_NAMESPACE:-game-java}/game-gate:${GAME_IMAGE_TAG:?必须设置不可变提交标签}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: game-gate
        GAME_BUILD_COMMIT: ${GAME_BUILD_COMMIT:?必须设置构建提交}
        GAME_BUILD_CONTRACT: ${GAME_BUILD_CONTRACT:?必须设置契约提交}
    environment:
      <<: *common-env
      GAME_ADVERTISE_HOST: "${GAME_GATE_ADVERTISE_HOST:-game-gate}"
      GAME_DUBBO_SECRET: "${GAME_DUBBO_SECRET:?缺少 GAME_DUBBO_SECRET}"
      GAME_GATE_TOKEN_SECRET: "${GAME_GATE_TOKEN_SECRET:?缺少 GAME_GATE_TOKEN_SECRET}"
      GAME_NODE_LINK_SECRET: "${GAME_NODE_LINK_SECRET:?缺少 GAME_NODE_LINK_SECRET}"
      GAME_GM_ADMIN_SECRET: "${GAME_GM_ADMIN_SECRET:?缺少 GAME_GM_ADMIN_SECRET}"
      GAME_DUBBO_LOGINURL: "tri://game-login:20881"
      GAME_DUBBO_FRIENDURL: "tri://game-friend:20883"
      GAME_DUBBO_CHATURL: "tri://game-chat:20884"
      GAME_DUBBO_TEAMURL: "tri://game-team:20885"
      GAME_DUBBO_GUILDURL: "tri://game-guild:20886"
      GAME_DUBBO_TRADEURL: "tri://game-trade:20887"
      GAME_DUBBO_MAILURL: "tri://game-mail:20916"
      GAME_DUBBO_RANKURL: "tri://game-rank:20917"
      GAME_DUBBO_MATCHURL: "tri://game-match:20888"
    depends_on:
      route-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      game-login: {condition: service_healthy}
      game-friend: {condition: service_healthy}
      game-chat: {condition: service_healthy}
      game-team: {condition: service_healthy}
      game-guild: {condition: service_healthy}
      game-trade: {condition: service_healthy}
      game-mail: {condition: service_healthy}
      game-rank: {condition: service_healthy}
      game-match: {condition: service_healthy}
      game-scene: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18103/actuator/health/readiness > /dev/null && timeout 2 bash -c 'exec 3<>/dev/tcp/game-gate/11000'"]
    ports: ["127.0.0.1:${GAME_GATE_HOST_PORT:-11000}:11000"]

  game-gateway:
    <<: *java
    image: ${GAME_IMAGE_NAMESPACE:-game-java}/game-gateway:${GAME_IMAGE_TAG:?必须设置不可变提交标签}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: game-gateway
        GAME_BUILD_COMMIT: ${GAME_BUILD_COMMIT:?必须设置构建提交}
        GAME_BUILD_CONTRACT: ${GAME_BUILD_CONTRACT:?必须设置契约提交}
    environment:
      <<: [*common-env, *db-env]
      GAME_ADVERTISE_HOST: "game-gateway"
      GAME_DUBBO_SECRET: "${GAME_DUBBO_SECRET:?缺少 GAME_DUBBO_SECRET}"
      GAME_GATE_TOKEN_SECRET: "${GAME_GATE_TOKEN_SECRET:?缺少 GAME_GATE_TOKEN_SECRET}"
      GAME_DUBBO_LOGINURL: "tri://game-login:20881"
    depends_on:
      route-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      game-login: {condition: service_healthy}
      game-gate: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18105/actuator/health/readiness > /dev/null && timeout 2 bash -c 'exec 3<>/dev/tcp/game-gateway/18081'"]
    ports: ["127.0.0.1:${GAME_GATEWAY_HOST_PORT:-18081}:18081"]

  game-robot:
    profiles: [tools]
    image: ${GAME_IMAGE_NAMESPACE:-game-java}/game-robot:${GAME_IMAGE_TAG:?}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        MODULE: game-robot
        GAME_BUILD_COMMIT: ${GAME_BUILD_COMMIT:?}
        GAME_BUILD_CONTRACT: ${GAME_BUILD_CONTRACT:?}
    environment:
      GAME_LOGIN_DEV_PASSWORD: ${GAME_LOGIN_DEV_PASSWORD:?}
      GAME_ADMIN_TOKEN: ${GAME_ADMIN_TOKEN:?}
      GAME_ASSET_OP_SECRET_GUILD: ${GAME_ASSET_OP_SECRET_GUILD:?}
      JDK_JAVA_OPTIONS: "-Xms32m -Xmx256m -XX:+ExitOnOutOfMemoryError"
    command: ["smoke", "--gateway", "http://game-gateway:18081"]
    mem_limit: 512m
    restart: "no"
