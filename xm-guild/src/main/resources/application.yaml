# xm-guild 默认（local）配置：Dubbo 直连、不需要 Nacos 服务端。用 Nacos 做注册中心时加 --spring.profiles.active=nacos。
# 进程从仓库根目录启动（table-dir 是相对路径）。
#
# 秘密只从环境变量注入，不写进本文件：
#   XM_DUBBO_SECRET        Dubbo 调用方鉴权密钥（必填，与 xm-gate 一致；缺失即拒绝启动）
#   XM_MYSQL_PASSWORD      MySQL 密码（本机无密码的 root 可不设）
#
# 权威数据在 MySQL xm_java 的四张帮会表（guild / guild_player_state / guild_member / guild_application，经 xm-pbmysql 建表）；
# 缓存、排行、申请推送冷却在 Redis；只读 xm_java.player（展示名与归属区，不归本服所有）。
spring:
  application:
    name: xm-guild
  main:
    # 只为管理端点起一个 Servlet 容器；Dubbo 端口不经过它。
    web-application-type: servlet
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 会话级 READ COMMITTED（guild-spec §1.6、§7.5：事务外的自动提交语句也不能落回 RR 拿间隙锁）；STRICT_TRANS_TABLES 同基线 DSN；
    # innodb_lock_wait_timeout=1 是基线值（guild 的 1205 不重试、直接 14021，等锁更久只会吃掉预算；friend 是 3）；
    # useAffectedRows=true 等价于 Go 的 ClientFoundRows=false：申请 IODKU 自检与 4.5 / 4.6 的带上限 upsert 依赖「实际改动行数」，不带它会静默出错；
    # socketTimeout 4 s ≤ 整请求预算之上的余量。
    url: "jdbc:mysql://127.0.0.1:3306/xm_java?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectTimeout=3000&socketTimeout=4000&useAffectedRows=true&sessionVariables=transaction_isolation='READ-COMMITTED',sql_mode='STRICT_TRANS_TABLES',innodb_lock_wait_timeout=1"
    username: ${XM_MYSQL_USER:root}
    password: ${XM_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 32
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      # 2 = READ COMMITTED（连接池按它设置每条连接；URL 里的会话变量是第二道保证）
      default-transaction-isolation: 2

# 管理端点：http://127.0.0.1:18110/actuator/health 与 /actuator/prometheus。
server:
  port: 18110
  address: ${XM_MANAGEMENT_ADDRESS:127.0.0.1}
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

xm:
  # 按方法热关停（运维止血阀）：每秒全量读 Redis 哈希 xm:killswitch；失联超过 60 s 整体放行（fail-open）
  killswitch:
    enabled: true
  advertise-host: 127.0.0.1
  # 配置表目录（导表器 .pb 产物），相对进程工作目录；从别处启动时用 XM_TABLE_DIR 覆盖。
  table-dir: config-data/tables
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  guild:
    # 缺省值同 mmorpg go/guild（guild-spec §7.12）；启动时校验 request-budget ∈ [500ms, 3500ms]。
    # 业务上限（申请有效期、每人 / 每帮待审数、成员与长老上限）只读配表 GuildRule / GuildLevel，不在这里配。
    request-budget: 3500ms
    cache-ttl: 30m
    push-timeout: 3s
    online-lookup-timeout: 800ms
    query-timeout: 3s
    worker-threads: 16
    worker-queue-capacity: 1024

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: false
  protocol:
    name: tri
    port: 20886
    host: ${xm.advertise-host}
  registry:
    address: N/A
  provider:
    timeout: 10000
  consumer:
    check: false
