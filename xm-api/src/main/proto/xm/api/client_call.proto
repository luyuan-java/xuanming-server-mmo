// Java 版内部契约：gate 把客户端消息转给后端（Dubbo Triple）。只在 Java 版内部使用，不是客户端契约。
syntax = "proto3";

package xm.api;

option java_package = "com.game.api.proto";
option java_multiple_files = true;

import "xm/api/zone_redirect.proto";

// 会话上下文：gate 发往后端的每个客户端调用都带上。后端只信任 gate 填的这些字段。
message SessionContext {
  uint32 gate_node_id = 1;
  // gate 进程实例 uuid：节点号会被复用，靠它区分新旧进程。
  string gate_instance_id = 2;
  uint32 session_id = 3;
  uint32 zone_id = 4;
  // 已认证账号；未登录为空。
  string account = 5;
  // 已绑定玩家；未进游戏（含进场失败、LeaveGame 之后）为 0。login 据此拒绝已在游戏里的会话再次 EnterGame / CreatePlayer。
  uint64 player_id = 6;
  string client_ip = 7;
  // 这条连接握手时出示的 gate 票据里的持票者与目标 zone（批次 5.4，docs/porting/zone-travel-spec.md §5.7、§5.8）：gate 在验票通过时从
  // GateTokenPayload.player_id / target_zone_id 原样抄下、此后每次调用都带上；gate 只存不判。
  // 重定向票据（226 传送、登录期重定向 GO-5，scene-manager 签）：ticket_player_id = 持票者（非 0），ticket_target_zone_id = 目标 zone。
  // 普通登录令牌（gateway 签）：ticket_player_id = 0，ticket_target_zone_id = 签发时的 zone（Java 把普通令牌钉在签发 zone，等于本会话的 zone_id）。
  // login 的用法：ticket_player_id != 0 且不等于请求进游戏的角色 → 2011（持票者不符）；
  // ticket_player_id != 0 且 ticket_target_zone_id == zone_id → 这条连接是持票来到本 zone 的，不再按位置记录把它重定向到别的 zone。
  // 不认识这两个字段的旧 gate 发来的调用两者都是 0 = 按普通登录处理。
  uint64 ticket_player_id = 8;
  uint32 ticket_target_zone_id = 9;
}

message ClientCall {
  SessionContext session = 1;
  uint32 message_id = 2;
  // 请求消息的序列化字节（类型由 message_id 决定）。
  bytes body = 3;
  // ClientRequest.id，原样回显给客户端。
  uint64 request_id = 4;
}

message ClientReply {
  // 应答消息的序列化字节，可以是 0 字节（proto3 全默认值的应答序列化后就是空，如新账号的 LoginResponse）。
  // 业务错误写在应答体自己的 error_message 字段里（客户端契约：robot / 客户端只看应答体，不看信封）。
  // 是否回包不看 body 是否为空，由 gate 按契约的应答类型决定：应答类型不是 Empty 的方法一律回包（哪怕 0 字节）；
  // 应答类型是 Empty 的方法只在 tip_id 非 0 时回包。
  bytes body = 1;
  // 只表示传输层失败（后端没能按方法处理这次调用：消息号不认识、请求体解析失败等），gate 放进
  // MessageContent.error_message.id。业务错误不用这个字段。
  uint32 tip_id = 2;
  repeated string tip_parameters = 3;
  // 给 gate 的会话指令，按顺序执行。
  repeated SessionDirective directives = 4;
}

message SessionDirective {
  oneof kind {
    BindAccount bind_account = 1;
    EnterScene enter_scene = 2;
    CloseSession close_session = 3;
    UnbindPlayer unbind_player = 4;
    RedirectToGate redirect_to_gate = 5;
  }
}

// 登录成功：把账号绑到会话上，之后的调用都带着它。
message BindAccount {
  string account = 1;
}

// 进游戏：gate 把会话绑定到玩家，并经节点链路把玩家送进指定场景节点的指定场景。
message EnterScene {
  uint64 player_id = 1;
  uint32 scene_node_id = 2;
  uint64 scene_id = 3;
  // 玩家数据归属围栏：scene 写回时必须带上，旧 epoch 的写入会被拒绝。
  uint64 owner_epoch = 4;
}

// 让 gate 关闭会话（先把 tip 发给客户端，再断开）。
message CloseSession {
  uint32 tip_id = 1;
}

// 离开游戏（LeaveGame 成功）：gate 向会话所在 scene 节点发 PlayerLeave{voluntary=true}（不在场景里则不发），
// 并清掉会话上的玩家与场景绑定；账号绑定保留，客户端可以回到选角。
message UnbindPlayer {
}

// 登录期重定向（GO-5，批次 5.4 的 b 段，zone-travel-spec §5.7、§5.8）：login 发现请求进游戏的角色此刻正在别的 zone（在线或断线重连租约内），
// 不夺权、不分配场景，改为请客户端连过去。login 在 EnterGame 的成功应答（EnterGameResponse{player_id}，不设 error_message）里带上本指令；
// gate 先把应答发给客户端，再推 124 RedirectToGateNotify（26 应答恒先于 124），会话随后转入「已重定向」状态等客户端断开。
// 这条指令不绑定玩家、不进任何场景（与 EnterScene 互斥：同一个应答里不会两者都有）。
// 不认识 5 号分支的旧 gate 读到的是 KIND_NOT_SET，只记一条告警、不推 124——所以滚动升级顺序是先 gate、后 login。
message RedirectToGate {
  // 必填：scene-manager 的 RedirectToZoneResponse.redirect 原样带来（token_payload 不得解析后重新序列化）。
  ZoneRedirect redirect = 1;
}

// gate 通知后端会话结束（断线或主动离开）。
message SessionClosed {
  SessionContext session = 1;
  // true = 客户端主动 LeaveGame；false = 断线。
  bool voluntary = 2;
}

// gate 通知 login：一条 EnterScene 指令没有送到任何 scene（会话已在关闭、链路层已关、建链失败），
// 这次进游戏夺得的归属（player_id, owner_epoch）没有写者，login 可以立即释放，不必等租约过期。
// 只在 gate 确定 PlayerEnter 从未写上链路时才发；已写出的进场由 scene 负责释放。
message AbandonedEnter {
  SessionContext session = 1;
  uint64 player_id = 2;
  uint64 owner_epoch = 3;
}

message Ack {
}
