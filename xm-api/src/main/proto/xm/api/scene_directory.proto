// Java 版内部契约：场景分配（xm-scene-manager 提供，Dubbo Triple）。
syntax = "proto3";

package xm.api;

option java_package = "com.game.api.proto";
option java_multiple_files = true;

import "xm/api/world_channel.proto";

message AssignSceneRequest {
  uint32 zone_id = 1;
  uint64 player_id = 2;
  // 期望进入的场景配置；0 表示用默认主世界。login 只在有玩家位置记录（在线 / 断线重连租约内）时填，取记录里的配置。
  uint32 preferred_scene_config_id = 3;
  // 期望回到的场景实例（玩家位置记录里的节点与场景号；0 = 没有）。该实例还在目录里就直接用它（不看人数），
  // 不在了按 preferred_scene_config_id 选（Java 的行为；基线在 zone 内只按 location 定 zone、落默认主世界，见 PARITY）。
  uint32 preferred_scene_node_id = 4;
  uint64 preferred_scene_id = 5;
}

message AssignSceneResponse {
  // 非 0 表示没有可用场景。
  uint32 tip_id = 1;
  uint32 scene_node_id = 2;
  uint64 scene_id = 3;
  uint32 scene_config_id = 4;
}

// scene → scene-manager：在线换图（63）本节点解析不了时，选跨节点的目标场景（批次 5.2）。
// scene-manager 只做选择：不铸 epoch、不写位置记录、不碰归属；归属交接由源节点的交出事务完成。
message SelectSwitchTargetRequest {
  uint32 zone_id = 1;
  uint64 player_id = 2;
  // 发起换图的玩家当前所在的节点与场景实例。
  uint32 from_scene_node_id = 3;
  uint64 from_scene_id = 4;
  // 期望的场景实例；非 0 时只按它解析（找不到或在排空中即拒，不回落到「按地图挑」）。
  uint64 want_scene_id = 5;
  // 期望的场景配置（地图）；want_scene_id 为 0 时按它选频道（排除 from_scene_id），
  // want_scene_id 非 0 时用来校验该场景的配置（不符即拒）；0 表示不指定。
  uint32 want_scene_config_id = 6;
}

message SelectSwitchTargetResponse {
  // 0 = 选中；非 0 是 scene-manager 的拒绝码（只进日志与指标，scene 对客户端一律推 3023）。
  uint32 tip_id = 1;
  uint32 scene_node_id = 2;
  uint64 scene_id = 3;
  uint32 scene_config_id = 4;
}

// scene → scene-manager：为一个新的镜像 / 副本实例取全服 scene_id 并定放置（批次 5.3，docs/porting/dungeon-mirror-spec.md §6.5、§6.6；
// 对应基线 SM CreateScene 的 createInstance 路径，go/scene_manager/internal/logic/createscenelogic.go:182-325，Java 只保留「发号 + 定放置」，D1、D3）。
// scene-manager 对实例零状态：不写 Redis（发号租约的续期除外）、不写软预占、不调 scene、不复核配表与源（节点是权威，已在逻辑线程上校验过）；
// 节点拿到号后在本地建实例，建好即在节点目录（SceneEntry.kind / source_scene_id）登记。号作废（应答迟到、玩家已离开）不留任何痕迹。
// 不幂等（同基线：每次请求一个新实例），调用方 retries = 0。
message CreateInstanceRequest {
  uint32 zone_id = 1;
  // 发起节点（5.3 放置恒为它，D2）。
  uint32 requester_scene_node_id = 2;
  // 发起玩家；dev 管理口建副本时为 0。MIRROR 必填。
  uint64 player_id = 3;
  // MIRROR / DUNGEON；别的取值是参数错。
  ChannelKind kind = 4;
  // MIRROR：源（发起玩家当前所在的主世界频道，必填）；DUNGEON：必须为 0。
  uint64 source_scene_id = 5;
  // 实例的地图（必填）：MIRROR = 源频道的配置号；DUNGEON = Dungeon 表该行的 scene_id。
  uint32 scene_config_id = 6;
  // MIRROR 必填（scene 已按 Mirror 表校验存在，D7）；DUNGEON 必须为 0。
  uint32 mirror_config_id = 7;
  // DUNGEON 必填；MIRROR 必须为 0（镜像的 dungeon_config_id 恒 0，同基线 scene_node_client.go:108-113）。
  uint32 dungeon_config_id = 8;
}

message CreateInstanceResponse {
  // 0 = 成功；非 0 是 scene-manager 的业务拒绝码（3005 参数错；3000 发起节点不接新实例，5.5 钩子），只进日志与指标，
  // scene 对客户端推 23 {3023}（D5）。发号租约无效不是业务拒绝：future 以异常完成，scene 推 23 {1003}（Q12）。
  uint32 tip_id = 1;
  // 实例落在哪个节点（5.3 恒等于 requester_scene_node_id；不等时 scene 必须拒绝建、推 23 {3023}，R11）。
  uint32 scene_node_id = 2;
  // 全服雪花号（NodeTypes.SCENE_MANAGER 租约的 worker，与主世界频道同一个发号器），非 0。
  uint64 scene_id = 3;
}
