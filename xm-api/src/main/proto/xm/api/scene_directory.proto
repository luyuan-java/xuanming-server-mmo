// Java 版内部契约：场景分配（xm-scene-manager 提供，Dubbo Triple）。
syntax = "proto3";

package xm.api;

option java_package = "com.game.api.proto";
option java_multiple_files = true;

message AssignSceneRequest {
  uint32 zone_id = 1;
  uint64 player_id = 2;
  // 期望进入的场景配置；0 表示用默认主世界。login 只在有玩家位置记录（在线 / 断线重连租约内）时填，取记录里的配置。
  uint32 preferred_scene_config_id = 3;
  // 期望回到的场景实例（玩家位置记录里的节点与场景号；0 = 没有）。该实例还在目录里就直接用它（不看人数），
  // 不在了按 preferred_scene_config_id 选（Java 的行为；基线在 zone 内只按 location 定 zone、落默认主世界，见 PARITY）。
  uint32 preferred_scene_node_id = 4;
  uint64 preferred_scene_id = 5;
}

message AssignSceneResponse {
  // 非 0 表示没有可用场景。
  uint32 tip_id = 1;
  uint32 scene_node_id = 2;
  uint64 scene_id = 3;
  uint32 scene_config_id = 4;
}

// scene → scene-manager：在线换图（63）本节点解析不了时，选跨节点的目标场景（批次 5.2）。
// scene-manager 只做选择：不铸 epoch、不写位置记录、不碰归属；归属交接由源节点的交出事务完成。
message SelectSwitchTargetRequest {
  uint32 zone_id = 1;
  uint64 player_id = 2;
  // 发起换图的玩家当前所在的节点与场景实例。
  uint32 from_scene_node_id = 3;
  uint64 from_scene_id = 4;
  // 期望的场景实例；非 0 时只按它解析（找不到或在排空中即拒，不回落到「按地图挑」）。
  uint64 want_scene_id = 5;
  // 期望的场景配置（地图）；want_scene_id 为 0 时按它选频道（排除 from_scene_id），
  // want_scene_id 非 0 时用来校验该场景的配置（不符即拒）；0 表示不指定。
  uint32 want_scene_config_id = 6;
}

message SelectSwitchTargetResponse {
  // 0 = 选中；非 0 是 scene-manager 的拒绝码（只进日志与指标，scene 对客户端一律推 3023）。
  uint32 tip_id = 1;
  uint32 scene_node_id = 2;
  uint64 scene_id = 3;
  uint32 scene_config_id = 4;
}
