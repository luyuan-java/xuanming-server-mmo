# xm-trade 默认（local）配置：Dubbo 直连、不需要 Nacos 服务端。用 Nacos 做注册中心时加 --spring.profiles.active=nacos。
#
# 秘密只从环境变量注入，不写进本文件：
#   XM_DUBBO_SECRET    Dubbo 调用方鉴权密钥（必填，与 xm-gate 一致；缺失即拒绝启动）
#   XM_ADMIN_TOKEN     运维令牌（播种接口 POST /admin/trade/seed-listing 的 X-Xm-Admin-Token，与 xm-data 共用）；不设则 /admin/** 一律 503
#   XM_MYSQL_PASSWORD  MySQL 密码（本机无密码的 root 可不设）
#
# 权威数据在 MySQL xm_java 的两张聚宝斋表（trade_listing / trade_favorite，经 xm-pbmysql 建表）；只读 xm_java.player（归属区 zone_id），
# 这张表不归本服所有。Redis 只用于 listing_id 雪花租约与热关停规则，不存任何业务键（trade-spec §1.11）。
spring:
  application:
    name: xm-trade
  main:
    # 只为管理端点与播种接口起一个 Servlet 容器；Dubbo 端口不经过它。
    web-application-type: servlet
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 会话级 READ COMMITTED（取消收藏的自动提交 DELETE 不能落回 RR 拿间隙锁，trade-spec §1.9）；STRICT_TRANS_TABLES 同基线 DSN
    # （servicecontext.go:225-243，连接层兜底「超长文本被静默截断」）；innodb_lock_wait_timeout=2 对齐单条 SQL 上限 2000 ms（Q7；只有收藏写入会等锁）；
    # useAffectedRows 与其他服务一致；socketTimeout 4 s ≤ 整请求预算之上的余量。启动时校验 RC 与严格模式（TradeStartupChecks），不符即拒启。
    url: "jdbc:mysql://127.0.0.1:3306/xm_java?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectTimeout=3000&socketTimeout=4000&useAffectedRows=true&sessionVariables=transaction_isolation='READ-COMMITTED',sql_mode='STRICT_TRANS_TABLES',innodb_lock_wait_timeout=2"
    username: ${XM_MYSQL_USER:root}
    password: ${XM_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 32
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      # 2 = READ COMMITTED（连接池按它设置每条连接；URL 里的会话变量是第二道保证）
      default-transaction-isolation: 2

# 管理端口：http://127.0.0.1:18111/actuator/health、/actuator/prometheus 与 dev 播种接口 POST /admin/trade/seed-listing。
# 默认只绑本机，不要暴露到公网（播种接口在 prod 也注册、只回 403，令牌仍是第一道闸）。
server:
  port: 18111
  address: ${XM_MANAGEMENT_ADDRESS:127.0.0.1}
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

xm:
  # 运行模式：只有 dev / test（含别名 development / local / testing）开放播种接口，其余（含未设、写错）一律 403。进程缺省 prod；
  # 本机切片由 tools/local/start-slice.sh 设 XM_RUN_MODE=dev。
  run-mode: ${XM_RUN_MODE:prod}
  # 按方法热关停（运维止血阀）：每秒全量读 Redis 哈希 xm:killswitch；失联超过 60 s 整体放行（fail-open）。
  # 客户端方法（trade.ClientPlayerJubaozhai/*）已在 gate 检查，这里的提供方过滤器不查 ClientMessageService.handle。
  killswitch:
    enabled: true
  advertise-host: 127.0.0.1
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  trade:
    # 市场参数同 mmorpg go/trade/etc/trade.yaml:91-100（trade-spec §0.6）。scope 没有代码缺省值，只认 zone / global（区分大小写），
    # 写错或漏写拒启；两种范围要各验一次时改 XM_TRADE_MARKET_SCOPE 并重启（robot --trade-scope 与它一致）。
    market:
      scope: ${XM_TRADE_MARKET_SCOPE:zone}
      default-page-size: 20      # > 0 且 ≤ max-page-size
      max-page-size: 20
      max-page: 100              # 防深分页：OFFSET ≤ (max-page − 1) × max-page-size
      max-favorites-per-player: 100   # 软上限；计数包括已经看不见的收藏（Q8 保持基线）
    # 启动时校验 request-budget ∈ [500ms, 3500ms]（基线 Timeout 4000 − 500）。单次上限（归属区 1500 ms、单条 SQL 2000 ms）是代码常量。
    request-budget: 3500ms
    query-timeout: 3s
    worker-threads: 16
    worker-queue-capacity: 1024

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: false
  protocol:
    name: tri
    port: 20887
    host: ${xm.advertise-host}
  registry:
    address: N/A
  provider:
    timeout: 10000
  consumer:
    check: false
