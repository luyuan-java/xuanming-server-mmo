# game-team 默认（local）配置：Dubbo 直连、不需要 Nacos 服务端。用 Nacos 做注册中心时加 --spring.profiles.active=nacos。
#
# 秘密只从环境变量注入，不写进本文件：
#   GAME_DUBBO_SECRET        Dubbo 调用方鉴权密钥（必填，与 game-gate 一致；缺失即拒绝启动）
#   GAME_MYSQL_PASSWORD      MySQL 密码（本机无密码的 root 可不设）
#
# 权威数据全部在 Redis（game:{team}:rec / info / player / invite），只读 game.player（展示资料与 home zone，不归本服所有）。
# 整队开战（211）的预检、建票与 gather 调 game-match（game.dubbo.match-url）；game-match 不在时本进程照常启动，211 回 in-band 4030。
spring:
  application:
    name: game-team
  main:
    # 只为管理端点起一个 Servlet 容器；Dubbo 端口不经过它。
    web-application-type: servlet
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 只读 player 表：不建库（库由 game-player-store 维护）；socketTimeout 4 s ≤ 整请求预算之上的余量。
    url: "jdbc:mysql://127.0.0.1:3306/${game.namespace:game}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectTimeout=3000&socketTimeout=4000"
    username: ${GAME_MYSQL_USER:root}
    password: ${GAME_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 32
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      default-read-only: true

# 管理端点：http://127.0.0.1:18109/actuator/health 与 /actuator/prometheus。
server:
  port: 18109
  address: ${GAME_MANAGEMENT_ADDRESS:127.0.0.1}
  shutdown: immediate
  tomcat:
    threads:
      max: 4
      min-spare: 1

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

game:
  # 按方法热关停（运维止血阀）：每秒全量读 Redis 哈希 game:killswitch；失联超过 60 s 整体放行（fail-open）
  killswitch:
    enabled: true
  advertise-host: 127.0.0.1
  redis:
    address: redis://127.0.0.1:6379
    database: 12
  dubbo:
    # 整队开战调 game-match（Dubbo group match：预检 / 建票 / 退票 / gather）。nacos profile 置空走注册中心。
    match-url: tri://127.0.0.1:20888
  team:
    # 缺省值同 mmorpg go/match（team-spec §6.11）；启动时校验 request-budget ∈ [500ms, 3500ms]。
    allow-cross-zone: false
    request-budget: 3500ms
    push-batch-budget: 3s
    home-zone-timeout: 1500ms
    worker-threads: 16
    worker-queue-capacity: 1024
    push-threads: 4
    push-queue-capacity: 1024
    # 整队开战加锁之后的收尾池（清开战锁、退票；一次收尾最坏阻塞 110 s，不占请求工作线程）
    match-end-threads: 4
    match-end-queue-capacity: 1024

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    qos-enable: false
  protocol:
    name: tri
    port: 20885
    host: ${game.advertise-host}
  registry:
    address: N/A
  provider:
    timeout: 10000
  consumer:
    check: false
